async function salvaCheckpoint(cp){
  const saldi = {};
  (S.report.conti||[]).filter(c => CONTI_CORRENTI.includes(c.conto)).forEach(c => {
    const v = parseFloat(document.getElementById('cp_' + idSafe(c.conto))?.value);
    if (!isNaN(v)) saldi[c.conto] = {reale:v, teorico:c.saldo_teorico,
      scarto: c.saldo_teorico==null?null:+(v-c.saldo_teorico).toFixed(2)};
  });
  chiudiModale();
  if (!Object.keys(saldi).length) return toast('Inserisci almeno un saldo');
  await post('/api/balances', {verifiche_checkpoint: {[cp]: saldi}});
  const scarti = Object.entries(saldi).filter(([,v]) => v.scarto != null && Math.abs(v.scarto) > 0.01);
  toast(scarti.length ? `Registrato — ${scarti.length} conti con scarto` : 'Checkpoint chiuso, tutto quadra');
}

/* ============================================================ COPPIA */
function giroconto(){
  const q = {GC:[1,0], VT:[0,1], Coppia:[.5,.5]};
  let netto = 0;
  S.tx.forEach(t => {
    if (t.tipo === 'Neutro') return;
    const amt = t.importo < 0 ? Math.abs(t.importo) : -Math.abs(t.importo);
    const [pg] = q[t.intestatario_conto] || [.5];
    const [dg] = q[t.persona] || [.5];
    netto += amt * (pg - dg);
  });
  return {netto};
}
function vCoppia(){
  const g = giroconto();
  const l = sel(), sp = spese(l);
  const cond = sp.filter(t => t.persona === 'Coppia');
  const gcx = sp.filter(t => t.persona === 'GC'), vtx = sp.filter(t => t.persona === 'VT');
  const tC = Math.abs(cond.reduce((s,t)=>s+t.importo,0));
  const tG = Math.abs(gcx.reduce((s,t)=>s+t.importo,0));
  const tV = Math.abs(vtx.reduce((s,t)=>s+t.importo,0));
  const COLONNE_GIRI = {data: t=>t.data, descrizione: t=>t.merchant||t.descrizione, importo: t=>t.importo};
  const giri = ordina('coppia', S.tx.filter(t => t.sub === 'Giroconto - Split di coppia'), COLONNE_GIRI, 'data', 'desc').slice(0,14);

  return `${barraPeriodo(false)}
  <div class="card" style="text-align:center;padding:24px 20px;margin-bottom:10px">
    <div style="font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:680">Saldo giroconto complessivo</div>
    <div style="font-size:30px;font-weight:700;margin-top:6px;color:${g.netto>=0?'var(--gc)':'var(--vt)'}">
      ${Math.abs(g.netto) < 1 ? 'Siete in pari' : (g.netto>0 ? 'VT ti deve '+eur(g.netto) : 'Devi a VT '+eur(Math.abs(g.netto)))}</div>
    <div class="hint" style="margin-top:5px">Conto di provenienza incrociato con la persona di competenza, su tutto lo storico (§8)</div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    ${card('Spese condivise e personali nel periodo',
      barraQuota('Condivise (Coppia)', tC, tC+tG+tV, 'var(--coppia)') +
      barraQuota('Personali GC', tG, tC+tG+tV, 'var(--gc)') +
      barraQuota('Personali VT', tV, tC+tG+tV, 'var(--vt)') +
      `<div class="hint" style="margin-top:9px">${cond.length} movimenti condivisi · ${gcx.length} GC · ${vtx.length} VT</div>`)}
    ${card('Ultimi giroconti registrati', giri.length
      ? `<table><thead><tr>${thSort('coppia','Data','data','desc')}${thSort('coppia','Descrizione','descrizione','asc')}
          ${thSort('coppia','Importo','importo','desc','num')}</tr></thead><tbody>
        ${giri.map(t=>`<tr style="cursor:pointer" onclick="apriPannelloMovimento('${esc(t.key)}')">
          <td class="mut n">${dmy(t.data)}</td><td class="desc">${esc(t.merchant||t.descrizione)}</td>
          <td class="num ${t.importo<0?'neg':'pos'}">${eur2(t.importo)}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">Nessun giroconto registrato.</div>', '', true)}
  </div>`;
}
function barraQuota(lab,v,tot,col){
  return `<div class="rowbar"><span>${lab}</span><div class="track">
    <div class="fill" style="width:${pct(v,tot)}%;background:${col}"></div></div>

function statoDataset(){
  const tot = S.tx.length;
  const cat = S.tx.filter(t => t.stato !== 'Da verificare').length;
  const date = S.tx.map(t => t.data).sort();
  return {
    tot, cat, pct: tot ? Math.round(cat/tot*1000)/10 : 0,
    periodo: date.length ? dmy(date[0]) + ' → ' + dmy(date[date.length-1]) : '—',
    ultimoRebuild: S.report.generato_il || '—',
  };
}

function apriPubblica(){

      <input id="pubPass1" type="password" autocomplete="off"

      <input id="pubPass2" type="password" autocomplete="off"
        style="width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;margin-top:3px;box-sizing:border-box"></label>
    <p class="hint" style="margin-top:10px">Non viene salvata da nessuna parte, né qui né sul server: se la
    dimentichi, l'unico modo per tornare a leggere la copia pubblicata è pubblicarne una nuova con una
    passphrase nuova.</p>
    <div id="pubErr" class="hint" style="color:var(--bad);min-height:15px;margin-top:4px"></div>
    <div class="acts"><button class="btn" onclick="chiudiModale()">Annulla</button>
      <button class="btn pri" id="btnPubblica" onclick="avviaPubblicazione()">Cifra e pubblica</button></div>`);
}
async function avviaPubblicazione(){
  const p1 = document.getElementById('pubPass1').value;
  const p2 = document.getElementById('pubPass2').value;
  const err = document.getElementById('pubErr');
  if (p1.length < 12){ err.textContent = 'Troppo corta: servono almeno 12 caratteri.'; return; }
  if (p1 !== p2){ err.textContent = 'Le due passphrase non coincidono.'; return; }
  const btn = document.getElementById('btnPubblica');
  if (btn){ btn.disabled = true; btn.textContent = 'Cifratura in corso…'; }
  err.textContent = '';
  try {
    const dati = {transactions:S.tx, report:S.report, taxonomy:S.tax, overrides:S.ov,
      balances:S.bal, budget:S.budget, generato_il: new Date().toISOString().slice(0,16).replace('T',' ')};
    const blob = await pubCifra(dati, p1);
    if (btn) btn.textContent = 'Invio al server…';
    const r = await fetch('/api/pubblica?movimenti=' + S.tx.length, {
      method:'POST', headers:{'Content-Type':'application/octet-stream'}, body: blob});
    const d = await r.json();
    chiudiModale();
    mostraRiepilogoPubblicazione(d);
  } catch(e){
    err.textContent = 'Errore durante la cifratura o l\'invio: ' + e.message;
    if (btn){ btn.disabled = false; btn.textContent = 'Cifra e pubblica'; }
  }
}
function mostraRiepilogoPubblicazione(d){
  if (!d || d.bloccato){
    modale(`<h2>Pubblicazione ANNULLATA</h2>

      <div class="acts"><button class="btn pri" onclick="chiudiModale()">Ho capito</button></div>`);
    return;
  }
  const kb = (d.dimensione_bytes/1024).toFixed(0);
  modale(`<h2>${d.pubblicato ? 'Pubblicato' : 'Pronto, non inviato'}</h2>
    <p><b>${d.movimenti}</b> movimenti · file cifrato <b>${kb} KB</b> · generato il <b>${esc(d.generato_il)}</b></p>
    ${d.pubblicato
      ? `<p>Inviato al repository configurato${d.url ? ', raggiungibile su:<br><b>'+esc(d.url)+'</b>' : ''}.</p>`
      : `<p class="hint">${esc(d.git_log || 'La cartella pubblica/ è pronta in locale ma non è stata inviata da nessuna parte.')}</p>`}
    <div class="acts"><button class="btn pri" onclick="chiudiModale()">Ho capito</button></div>`);

/* ============================================================ DA VERIFICARE */
function daVerificareOrdinati(){
  return S.tx.filter(t => t.stato === 'Da verificare').sort((a,b) => Math.abs(b.importo) - Math.abs(a.importo));
}
/* Filtri LOCALI a questa sezione: il selettore persona in alto ragiona per
   competenza e pesa le quote, qui serve invece scegliere di chi sono le righe
   da sistemare. Tenerli separati evita di mescolare due significati diversi
   della stessa parola. */
function setFVer(campo, val){
  S.fVer = S.fVer || {cerca:'', persona:'', conto:''};
  S.fVer[campo] = (campo !== 'cerca' && S.fVer[campo] === val) ? '' : val;
  render();
  if (campo === 'cerca'){
    const el = document.getElementById('srchVer');
    if (el){ el.focus(); el.setSelectionRange(val.length, val.length); }
  }
}
function azzeraFVer(){ S.fVer = {cerca:'', persona:'', conto:''}; render(); }
/* La ricerca ignora gli spazi come il confronto delle regole: cercando
   "farmacia" devono uscire anche le causali spezzate in "FARM ACIA". */
function daVerificareFiltrati(){
  const f = S.fVer || {};
  const q = (f.cerca||'').trim().toUpperCase(), qc = q.replace(/\s+/g,'');
  return daVerificareOrdinati().filter(t => {
    if (f.persona && t.persona !== f.persona) return false;
    if (f.conto && t.conto !== f.conto) return false;
    if (!q) return true;
    const hay = ((t.merchant||'') + ' ' + t.descrizione + ' ' + t.conto).toUpperCase();
    return hay.includes(q) || hay.replace(/\s+/g,'').includes(qc);
  });
}
function barraFiltriVerifica(tutti){
  const f = S.fVer || {};
  const n = (campo, val) => tutti.filter(t => t[campo] === val).length;
  const chip = (campo, val, et) => {
    const c = n(campo, val);
    return `<button class="btn sm ${f[campo]===val?'pri':''}" ${c?'':'disabled'}
      onclick="setFVer('${campo}','${escJs(val)}')">${esc(et)} <b>${c}</b></button>`;
  };
  const conti = [...new Set(tutti.map(t => t.conto))].sort();
  const attivi = (f.cerca?1:0) + (f.persona?1:0) + (f.conto?1:0);
  return `<div class="bar" style="flex-wrap:wrap;gap:7px">
    <input class="srch" id="srchVer" placeholder="Cerca nella causale…" value="${esc(f.cerca||'')}"
      oninput="clearTimeout(window._sv);window._sv=setTimeout(()=>setFVer('cerca',this.value),260)">
    <span class="hint">di chi è:</span>
    ${['GC','VT','Coppia'].map(p => chip('persona', p, p)).join('')}
    ${conti.length > 1 ? `<span class="hint">conto:</span>` + conti.map(c => chip('conto', c, c)).join('') : ''}
    ${attivi ? `<button class="btn sm" onclick="azzeraFVer()">Togli i filtri</button>` : ''}
  </div>`;
}
function vVerificare(){
  const tutti = daVerificareOrdinati();
  if (!tutti.length) return card('Da verificare', `<div class="empty">
    <div style="font-size:32px">&#10003;</div><h2 style="margin:8px 0 4px">Tutto categorizzato</h2>
    <div>Nessun movimento in attesa di conferma.</div></div>`);

  /* Tutti insieme, non a batch di 10: chi non sa cosa mettere su una riga
     (es. serve una risposta di VT) la salta e va avanti, invece di restare
     bloccato sul batch corrente. */
  const batch = daVerificareFiltrati();
  // "Conferma" agisce su TUTTE le scelte fatte, anche su righe ora nascoste da
  // un filtro: nascondere una riga non deve buttare via quello che ho deciso.
  // "Accetta le proposte" invece agisce solo sul visibile, perche' e' un'azione
  // di massa e non deve toccare righe che non ho davanti (§5).
  const nScelti = tutti.filter(t => sceltoDaUtente(t)).length;
  const nScelrtiNascosti = nScelti - batch.filter(t => sceltoDaUtente(t)).length;
  const nProposte = batch.filter(t => !sceltoDaUtente(t) && (t.candidati||[]).length).length;
  const fatti = S.sessione || 0;
  const totIniziale = tutti.length + fatti;
  const filtrato = batch.length !== tutti.length;

  return `<div class="bar">
    <h2 style="font-size:14.5px">Da verificare</h2>
    <span class="hint">${filtrato ? `${batch.length} di ${tutti.length} rimasti` : `${tutti.length} rimasti`} · ordinati per importo</span>
    <span class="spacer"></span>
    ${nProposte ? `<button class="btn" onclick="accettaProposte()">Accetta le ${nProposte} proposte</button>` : ''}
    <button class="btn pri" ${nScelti?'':'disabled'} onclick="confermaBatch()">Conferma ${nScelti||''}</button>
  </div>
  ${barraFiltriVerifica(tutti)}
  ${nScelrtiNascosti ? `<div class="warnbox" style="padding:7px 11px">
    <b>${nScelrtiNascosti}</b> ${nScelrtiNascosti===1?'riga scelta è nascosta':'righe scelte sono nascoste'} dai filtri:
    premendo Conferma ${nScelrtiNascosti===1?'verrà salvata':'verranno salvate'} anche quell${nScelrtiNascosti===1?'a':'e'}.</div>` : ''}
  ${fatti ? `<div class="card" style="padding:9px 13px;margin-bottom:9px;display:flex;align-items:center;gap:12px">
    <span style="font-size:12.5px"><b class="pos">✓ ${fatti} sistemati</b> in questa sessione · ne restano <b>${tutti.length}</b></span>
    <span style="flex:1;height:7px;background:var(--line2);border-radius:4px;overflow:hidden">
      <span style="display:block;height:100%;width:${pct(fatti,totIniziale)}%;background:var(--ok)"></span></span>
    <span class="hint n">${pct(fatti,totIniziale).toFixed(0)}%</span></div>` : ''}
  <div class="warnbox" style="display:flex;align-items:center;gap:10px">
    <span style="flex:1">Scegli <b>categoria</b> e poi <b>voce</b>. Dove il sistema ha trovato un indizio la proposta è già impostata.
    Immobile, Viaggio e Sfera si attivano quando la categoria lo prevede. Confermando salvi subito;
    se il testo si presta, ti verrà proposto — dopo — di ricordare la regola per l'esercente.</span>
    ${Object.keys(S.ov.merchant_appresi||{}).length ? `<button class="btn sm" onclick="go('dati')">
      Regole apprese (${Object.keys(S.ov.merchant_appresi).length})</button>` : ''}
  </div>
  <datalist id="dl_viaggi">${[...new Set(S.tx.map(t=>t.viaggio).filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
  <div class="vrow" style="grid-template-columns:74px 1fr 92px 190px 160px 90px 150px 140px 100px;
    font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:660;padding:2px 0 4px">
    <span></span><span></span><span></span><span>Categoria</span><span>Voce</span><span>Persona</span>
    <span>Immobile</span><span>Viaggio</span><span>Sfera</span></div>
  ${!batch.length ? `<div class="empty" style="padding:26px">
    <b>Nessun movimento con questi filtri.</b><br>
    <span class="mut">Ne restano ${tutti.length} in tutto.</span><br>
    <button class="btn sm" style="margin-top:9px" onclick="azzeraFVer()">Togli i filtri</button></div>` : ''}
  ${batch.map(t => {
    const p = S.pending[t.key] || {};
    const sugg = (t.candidati && t.candidati.length) ? spezzaCandidato(t.candidati[0]) : null;
    const ma = 'macro' in p ? p.macro : (sugg ? sugg[0] : '');
    const su = 'sub' in p ? p.sub : (sugg ? sugg[1] : '');
    const pronto = ma && su;
    const im = 'immobile' in p ? p.immobile : t.immobile;
    const vg = 'viaggio' in p ? p.viaggio : t.viaggio;
    const sf = 'sfera' in p ? p.sfera : t.sfera;
    return `<div class="vrow" style="grid-template-columns:74px 1fr 92px 190px 160px 90px 150px 140px 100px;cursor:pointer"
        onclick="apriPannelloMovimento('${esc(t.key)}')">
      <span class="d">${dmy(t.data)}</span>
      <span class="t" title="${esc(t.descrizione)}">${esc(t.merchant || t.descrizione.slice(0,60))}
        <small>${esc(t.conto)} · ${esc(t.categoria_storica || 'nessuna categoria storica')}</small></span>
      <span class="num ${t.importo<0?'neg':'pos'}" style="text-align:right;font-weight:650">${eur2(t.importo)}</span>
      <select class="${pronto?'sugg':''}" onclick="event.stopPropagation()" onchange="edit('${t.key}','macro',this.value)">${optMacro(ma)}</select>
      <select class="${pronto?'sugg':''}" onclick="event.stopPropagation()" onchange="edit('${t.key}','sub',this.value)">${optSub(ma, su)}</select>
      <select onclick="event.stopPropagation()" onchange="edit('${t.key}','persona',this.value)">
        ${['GC','VT','Coppia'].map(x=>`<option ${(p.persona??t.persona)===x?'selected':''}>${x}</option>`).join('')}
      </select>
      ${(ma==='CASA'||ma==='ENTRATE')
        ? `<select onclick="event.stopPropagation()" onchange="editValore('${t.key}','immobile',this.value)">
            <option value="">— nessuno —</option>
            ${(S.tax.immobili||[]).map(i=>`<option value="${esc(i)}" ${im===i?'selected':''}>${esc(i)}</option>`).join('')}
          </select>`
        : `<span class="mut" style="text-align:center">—</span>`}
      ${ma==='VIAGGI'
        ? `<input list="dl_viaggi" value="${esc(vg||'')}" placeholder="dove?" onclick="event.stopPropagation()" onchange="editValore('${t.key}','viaggio',this.value)">`
        : `<span class="mut" style="text-align:center">—</span>`}
      <select onclick="event.stopPropagation()" onchange="editValore('${t.key}','sfera',this.value)">
        ${['Privata','P.IVA'].map(x=>`<option ${sf===x?'selected':''}>${x}</option>`).join('')}</select>
      </div>`;
  }).join('')}
  ${nProposte ? `<div class="bar" style="margin-top:8px">
    <button class="btn sm" onclick="accettaProposte()">Accetta le ${nProposte} proposte automatiche</button>
    <span class="hint">le imposta come scelte tue: puoi ancora correggerle riga per riga prima di confermare</span></div>` : ''}`;
}
function accettaProposte(){
  // solo il visibile: e' un'azione di massa, non deve toccare righe filtrate via
  daVerificareFiltrati().forEach(t => {
    if (t.candidati && t.candidati.length){
      const [ma,su] = spezzaCandidato(t.candidati[0]);
      const p = S.pending[t.key] = S.pending[t.key] || {};
      p.macro = ma; p.sub = su;
    }
  });
  render();
}

/* ---------- pannello regole apprese ---------- */
function movimentiToccati(pattern, macro){
  const P = String(pattern||'').toUpperCase();
  if (!P) return [];
  const tipo = S.tax.macro?.[macro]?.tipo;
  /* Stesso confronto di build_dataset.py: se il pattern non si trova tal quale,
     si riprova senza spazi. Gli estratti mandano a capo dentro la parola
     inserendo uno spazio ("FARM ACIA", "SEIG ELATO"), e senza questo una
     regola scritta correttamente non aggancerebbe nulla. Soglia a 5 caratteri:
     togliendo gli spazi le parole vicine si accostano e un pattern corto
     potrebbe agganciarsi per caso. L'anteprima "tocca N movimenti" deve
     contare esattamente quello che poi conta la pipeline. */
  const Pc = P.replace(/\s+/g,'');
  return S.tx.filter(t => {
    const hay = ((t.merchant||'') + ' ' + t.descrizione).toUpperCase();
    if (!hay.includes(P) && !(Pc.length >= 5 && hay.replace(/\s+/g,'').includes(Pc))) return false;
    if (tipo === 'Entrata' && t.importo < 0) return false;
    if (tipo === 'Spesa' && t.importo > 0) return false;
    return true;
  });
}
function pannelloRegole(){
  const R = Object.entries(S.ov.merchant_appresi||{});
  modale(`<h2>Regole apprese</h2>
    <p>Queste regole categorizzano automaticamente ogni movimento il cui testo contiene il pattern.
    Una regola verso una categoria di entrata non tocca mai le uscite, e viceversa.</p>
    <div style="max-height:300px;overflow:auto;margin-bottom:14px">
      ${R.length ? R.map(([pat,v],i) => {
        const n = movimentiToccati(pat, v.macro).length;
        return `<div style="display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2)">
          <span style="flex:1"><b>${esc(pat)}</b><br>
            <small class="mut">→ ${esc(v.macro)} / ${esc(v.sub)} · tocca ${n} moviment${n===1?'o':'i'}</small></span>
          <button class="btn sm" onclick="eliminaRegola('${esc(pat)}')">Elimina</button></div>`;
      }).join('') : '<div class="empty">Nessuna regola memorizzata.</div>'}
    </div>
    <div class="acts"><button class="btn pri" onclick="chiudiModale()">Chiudi</button></div>`);
}
async function eliminaRegola(pat){
  chiudiModale();
  await post('/api/overrides', {merchant_appresi: {[pat]: null}});
  toast('Regola eliminata');
}
/* Il salvataggio avviene subito, un solo click: la modale "ricorda regole" e'
   un passo successivo facoltativo, non un blocco - prima chiedeva conferma
   dentro la modale e chi non la completava restava con l'intero batch invariato. */
async function confermaBatch(){
  const batch = daVerificareOrdinati().filter(t => sceltoDaUtente(t));
  // catturati PRIMA di salvare (con la proposta risolta se l'utente non l'ha
  // toccata): salvaBatch() svuota S.pending per queste chiavi
  const cand = batch.filter(t => t.merchant && chiaveMerchant(t.merchant).length >= 4)
    .map(t => { const [macro,sub] = risolviCategoria(t);
                return {key:t.key, merchant:t.merchant, importo:t.importo, macro, sub}; });
  await salvaBatch();
  if (cand.length) proponiRegole(cand);
}
function proponiRegole(cand){
  S._cand = cand;
  modale(`<h2>Ricordo queste regole per il futuro?</h2>
    <p>I movimenti sono già confermati. Puoi anche ricordare il pattern per il futuro: ogni
    movimento il cui testo lo contiene verrà categorizzato così, anche nello storico. Controlla
    quanti ne tocca: se sono più del previsto, accorcia o allunga il pattern.</p>
    <div style="max-height:290px;overflow:auto;margin-bottom:14px">
      ${cand.map((t,i) => {
        const pat = chiaveMerchant(t.merchant);
        return `<div style="display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line2)">
          <input type="checkbox" id="mk${i}" style="margin-top:9px">
          <span style="flex:1">
            <input id="pt${i}" value="${esc(pat)}" oninput="contaTocchi(${i})"
              style="width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:5px;font-weight:640;font-size:12.5px">
            <small class="mut">→ ${esc(t.macro)} / ${esc(t.sub)} · <span id="ct${i}"></span></small>
          </span></div>`;
      }).join('')}
    </div>
    <div class="acts"><button class="btn" onclick="chiudiModale()">Non ora</button>
      <button class="btn pri" onclick="confermaRegole()">Salva le regole spuntate</button></div>`);
  cand.forEach((t,i) => contaTocchi(i));
}
/* Pattern conservativo: toglie solo i codici transazione in coda, mai cifre
   che fanno parte del nome (es. "TREVES 3" resta intero). */
function chiaveMerchant(m){
  let k = String(m||'').trim().toUpperCase().replace(/\s{2,}/g,' ');
  k = k.replace(/\s+[0-9A-F]{6,}$/,'');   // codici esadecimali di transazione
  k = k.replace(/\s+\d{4,}$/,'');         // numeri lunghi in coda
  return k.trim().slice(0,34);
}
function contaTocchi(i){
  const t = (S._cand||[])[i]; if (!t) return;
  const pat = document.getElementById('pt'+i)?.value || '';
  const el = document.getElementById('ct'+i); if (!el) return;
  if (pat.length < 3){ el.innerHTML = '<span class="neg">pattern troppo corto</span>'; return; }
  const n = movimentiToccati(pat, t.macro).length;
  el.innerHTML = n > 25
    ? `<span class="neg">tocca ${n} movimenti — controlla</span>`
    : `tocca ${n} moviment${n===1?'o':'i'}`;
}
async function confermaRegole(){
  const regole = {};
  (S._cand||[]).forEach((t,i) => {
    if (!document.getElementById('mk'+i)?.checked) return;
    const pat = (document.getElementById('pt'+i)?.value || '').trim().toUpperCase();
    if (pat.length < 3) return;
    regole[pat] = {macro:t.macro, sub:t.sub, segno: t.importo >= 0 ? 'positivo' : 'negativo'};
  });
  chiudiModale();
  const n = Object.keys(regole).length;
  if (!n) return;
  await post('/api/overrides', {merchant_appresi: regole});
  toast(n + (n===1?' regola salvata':' regole salvate') + ' e riapplicate');
}
async function salvaBatch(){
  const batch = daVerificareOrdinati();
  const mov = {};
  batch.forEach(t => {
    if (!sceltoDaUtente(t)) return;
    const p = S.pending[t.key];
    const [macro, sub] = risolviCategoria(t);
    // parte dall'override gia' salvato (se c'e'): stesso motivo del fix in salvaPending()
    const o = {...(S.ov.movimenti?.[t.key]||{}), macro, sub, stato:'Manuale',
               persona: p?.persona ?? t.persona};
    for (const f of ['immobile','viaggio','sfera']) if (p && f in p) o[f] = p[f];
    mov[t.key] = o;
    delete S.pending[t.key];
  });
  const n = Object.keys(mov).length;
  const primaDi = daVerificareOrdinati().length;
  await post('/api/overrides', {movimenti: mov});
  const dopo = daVerificareOrdinati().length;
  S.sessione = (S.sessione || 0) + (primaDi - dopo);
  const extra = (primaDi - dopo) - n;
  toast(`${n} confermati${extra>0?` · ${extra} sistemati dalle regole`:''} · ne restano ${dopo}`);
  render();
}

/* ============================================================ modale */
function modale(html){ document.getElementById('modal').innerHTML = html;
  document.getElementById('ovl').classList.add('on'); }
function chiudiModale(){ document.getElementById('ovl').classList.remove('on'); }
document.getElementById('ovl').addEventListener('click', e => { if (e.target.id === 'ovl') chiudiModale(); });

/* ============================================================ pannello scorrevole (Lavoro 2/3)
   Un solo componente, due modalita': "movimento" (correzione di una riga) e
   "categoria" (esplorazione prima di saltare in Analisi). Entra da destra,
   lascia vedere la pagina sotto. Le modifiche vivono in S.pannello.draft finche'
   non si preme Conferma: chiudere senza confermare non scrive nulla (§richiesta). */
function renderPannello(){
  const el = document.getElementById('panel');
  if (!S.pannello){ document.getElementById('povl').classList.remove('on'); if (el) el.innerHTML=''; return; }
  document.getElementById('povl').classList.add('on');
  el.innerHTML = S.pannello.modo === 'movimento' ? pannelloMovimento() : pannelloCategoria();
}
function chiudiPannello(force){
  if (!force && S.pannello?.modo === 'movimento' && Object.keys(S.pannello.draft||{}).length){
    if (!confirm('Ci sono modifiche non confermate su questo movimento. Chiudere e scartarle?')) return;
  }
  S.pannello = null;
  renderPannello();
}
document.getElementById('povl').addEventListener('click', e => { if (e.target.id === 'povl') chiudiPannello(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.pannello) chiudiPannello(); });

/* ---------- modalita' movimento ---------- */
function apriPannelloMovimento(key){
  const t = S.tx.find(x => x.key === key);
  if (!t) return toast('Movimento non trovato');
  S.pannello = {modo:'movimento', key, draft:{...(S.pending[key]||{})}};
  renderPannello();
}
function pannelloValore(campo){
  const t = S.tx.find(x => x.key === S.pannello.key) || {};
  const d = S.pannello.draft;
  return campo in d ? d[campo] : t[campo];
}
/* stessa logica di edit(): macro cambiata -> voce ricalcolata */
function pannelloSet(campo,val){
  const p = S.pannello.draft;
  if (val === '') delete p[campo]; else p[campo] = val;
  if (campo === 'macro'){
    const subs = sottoVoci(val);
    if (subs.length === 1) p.sub = subs[0];
    else if (!subs.includes(p.sub)) delete p.sub;
  }
  renderPannello();
}
/* come editValore(): il vuoto e' un valore esplicito, per poter rimuovere un
   immobile/viaggio/sfera gia' impostato (trappola §5) */
function pannelloSetValore(campo,val){
  S.pannello.draft[campo] = val || null;
  renderPannello();
}
function campoPertinente(macro,campo){
  if (campo === 'immobile') return macro === 'CASA' || macro === 'ENTRATE';
  if (campo === 'viaggio') return macro === 'VIAGGI';
  return true;
}
const ETICHETTE_CAMPO = {macro:'Categoria', sub:'Voce', persona:'Persona', sfera:'Sfera',
  immobile:'Immobile', viaggio:'Viaggio', stato:'Stato'};
const ORIGINE_REGOLA_TXT = {
  override_manuale: 'Corretto a mano', merchant_appreso: 'Regola imparata su questo esercente',
  categoria_storica: 'Categoria storica (Excel)', keyword: 'Parola chiave nel dizionario',
  regola_extra: 'Regola extra', regola_extra_entrata: 'Regola extra (entrata su macro di spesa)',
  conflitto_keyword: 'Conflitto fra parole chiave — da verificare',
  nessun_match: 'Nessuna regola l\'ha riconosciuto',
  entrata_su_macro_spesa: 'Entrata su una macro di spesa, sopra soglia storno',
};
function pannelloMovimento(){
  const t = S.tx.find(x => x.key === S.pannello.key);
  if (!t) return `<div class="phd"><h2 style="font-size:15px;flex:1">Movimento</h2>
    <button class="pclose" onclick="chiudiPannello()">×</button></div>
    <div class="pbd"><div class="empty">Movimento non trovato — probabilmente il dataset è stato ricostruito.</div></div>`;
  const d = S.pannello.draft;
  const ma = pannelloValore('macro'), su = pannelloValore('sub');
  const pe = pannelloValore('persona'), sf = pannelloValore('sfera'), st = pannelloValore('stato');
  const im = pannelloValore('immobile'), vg = pannelloValore('viaggio');
  const nMod = Object.keys(d).length;
  const immOk = campoPertinente(ma,'immobile'), viaOk = campoPertinente(ma,'viaggio');
  const origineTxt = t.origine_regola?.startsWith('regola_forzata:')
    ? 'Regola forzata (' + t.origine_regola.slice('regola_forzata:'.length) + ')'
    : (ORIGINE_REGOLA_TXT[t.origine_regola] || t.origine_regola || '—');

  return `<div class="phd">
      <h2 style="font-size:15px;flex:1">Movimento</h2>
      <button class="pclose" onclick="chiudiPannello()" title="Chiudi (Esc)">×</button></div>
    <div class="pbd">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
        <span class="hint n">${dmy(t.data)} · ${esc(t.conto)}</span>
        <span class="num ${t.importo<0?'neg':'pos'}" style="font-size:23px;font-weight:700">${eur2(t.importo)}</span>
      </div>
      <div style="background:var(--head);border:1px solid var(--line2);border-radius:7px;padding:10px 12px;
        margin:10px 0 14px;font-size:12.5px;line-height:1.5;word-break:break-word">${esc(t.descrizione)}</div>
      <div class="hint" style="margin-bottom:16px;line-height:1.7">
        Esercente: <b style="color:var(--ink)">${esc(t.merchant || '—')}</b><br>
        Fonte: <b style="color:var(--ink)">${esc(t.fonte || '—')}</b> ·
        Sfera storica: <b style="color:var(--ink)">${esc(t.sfera_storica || t.sfera || '—')}</b><br>
        Classificato da: <b style="color:var(--ink)">${esc(origineTxt)}</b>
        ${t.regola_applicata ? ` · pattern “${esc(t.regola_applicata)}”` : ''}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px">
        <label class="hint">Categoria<br>
          <select style="width:100%;padding:6px;border:1px solid var(--line);border-radius:6px"
            onchange="pannelloSet('macro',this.value)">${optMacro(ma)}</select></label>
        <label class="hint">Voce<br>
          <select style="width:100%;padding:6px;border:1px solid var(--line);border-radius:6px"
            onchange="pannelloSet('sub',this.value)">${optSub(ma,su)}</select></label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px">
        <label class="hint">Persona<br>
          <select style="width:100%;padding:6px;border:1px solid var(--line);border-radius:6px"
            onchange="pannelloSet('persona',this.value)">
            ${['GC','VT','Coppia'].map(x=>`<option ${pe===x?'selected':''}>${x}</option>`).join('')}</select></label>
        <label class="hint">Sfera<br>
          <select style="width:100%;padding:6px;border:1px solid var(--line);border-radius:6px"
            onchange="pannelloSetValore('sfera',this.value)">
            ${['Privata','P.IVA'].map(x=>`<option ${sf===x?'selected':''}>${x}</option>`).join('')}</select></label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px">
        <label class="hint">Immobile${immOk?'':' <span class="mut">— non pertinente per '+esc(ma||'questa categoria')+'</span>'}<br>
          <select style="width:100%;padding:6px;border:1px solid var(--line);border-radius:6px"
            ${immOk||im?'':'disabled'} onchange="pannelloSetValore('immobile',this.value)">
            <option value="">— nessuno —</option>
            ${(S.tax.immobili||[]).map(i=>`<option value="${esc(i)}" ${im===i?'selected':''}>${esc(i)}</option>`).join('')}</select></label>
        <label class="hint">Viaggio${viaOk?'':' <span class="mut">— non pertinente per '+esc(ma||'questa categoria')+'</span>'}<br>
          <input list="dl_viaggi_pannello" value="${esc(vg||'')}" placeholder="dove?"
            style="width:100%;padding:6px;border:1px solid var(--line);border-radius:6px"
            ${viaOk||vg?'':'disabled'} onchange="pannelloSetValore('viaggio',this.value)"></label>
      </div>
      <datalist id="dl_viaggi_pannello">${[...new Set(S.tx.map(x=>x.viaggio).filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
      <label class="hint" style="display:block;max-width:230px">Stato<br>
        <select style="width:100%;padding:6px;border:1px solid var(--line);border-radius:6px"
          onchange="pannelloSet('stato',this.value)">
          ${['Automatico','Manuale','Da verificare'].map(x=>`<option ${st===x?'selected':''}>${x}</option>`).join('')}</select></label>
    </div>
    <div class="pft">
      ${nMod ? `<span class="hint" style="margin-right:auto">${Object.keys(d).map(c=>ETICHETTE_CAMPO[c]||c).join(', ')} modificat${nMod===1?'o':'i'}</span>` : ''}
      <button class="btn" onclick="chiudiPannello()">Annulla</button>
      <button class="btn pri" ${nMod?'':'disabled'} onclick="confermaPannelloMovimento()">Conferma</button>
    </div>`;
}
async function confermaPannelloMovimento(){
  const key = S.pannello.key, p = S.pannello.draft;
  const o = {...(S.ov.movimenti?.[key] || {})};
  o.stato = p.stato || o.stato || 'Manuale';
  const err = applicaCategoria(o, p, key);
  if (err){ toast('Non salvato: ' + err); return; }   // il pannello resta aperto
  if (p.persona) o.persona = p.persona;
  if ('immobile' in p) o.immobile = p.immobile;
  if ('viaggio' in p) o.viaggio = p.viaggio;
  if ('sfera' in p) o.sfera = p.sfera;
  const cambiati = Object.keys(p).filter(c => ETICHETTE_CAMPO[c]).map(c => ETICHETTE_CAMPO[c]);
  delete S.pending[key];
  chiudiPannello(true);
  await post('/api/overrides', {movimenti: {[key]: o}});
  toast(cambiati.length ? `Movimento salvato — modificati: ${cambiati.join(', ')}` : 'Movimento salvato');
}

/* ---------- modalita' categoria ---------- */
function pannelloCategoria(){
  /* Stesso pannello per due cose diverse: una macro di spesa (aperta dalla
     ciambella o dalla legenda) e una voce di entrata (aperta dalla scheda
     "Da dove arrivano le entrate"). Cambiano la lista di partenza, il colore,
     l'asse di scomposizione e il segno; l'impianto è identico, e tenerlo uno
     solo evita che le due viste divergano col tempo. */
  const ent = !!S.pannello.entrata;
  const macro = ent ? S.pannello.voce : S.pannello.macro;
  const scomponi = S.persona === 'GC' || S.persona === 'VT';
  const l = ent ? entrate(sel()).filter(t => (t.sub || t.macro) === macro)
                : spese(sel()).filter(t => t.macro === macro);
  const col = ent ? 'var(--ok)' : colore(macro);
  const g = aggrega(l, () => macro)[0] || {v:0, proprie:0, comuni:0, n:0};
  // Per un'entrata la sotto-voce sarebbe la voce stessa: l'asse che dice
  // qualcosa è da chi arriva il denaro.
  const sub = ent ? aggrega(l, t => t.merchant || t.descrizione.slice(0,34) || '—')
                  : aggrega(l, t => t.sub || '—');
  const maxSub = sub[0]?.v || 1;
  const cols = colonneConfronto();
  const valCol = c => (ent ? c.perVoceEnt[macro] : c.perMacro[macro]) || 0;
  const maxCol = Math.max(...cols.map(valCol), 1);
  const top = [...l].sort((a,b) => Math.abs(imp(b)) - Math.abs(imp(a))).slice(0,20);

  return `<div class="phd">${ent
      ? `<span class="ico" style="background:var(--ok);width:26px;height:26px"></span>`
      : bolla(macro,26)}<h2 style="font-size:15px;flex:1">${esc(macro)}</h2>
      <button class="pclose" onclick="chiudiPannello()" title="Chiudi (Esc)">×</button></div>
    <div class="pbd">
      <div style="margin-bottom:18px">
        <div class="hint">Totale nel periodo · ${esc(rangePeriodo()[2])}</div>
        <div class="num ${ent?'pos':'neg'}" style="font-size:27px;font-weight:700">${eur(g.v)}</div>
        ${scomponi ? `<div class="hint">proprie ${eur(g.proprie)} · quota comuni ${eur(g.comuni)}</div>` : ''}
        <div class="hint">${g.n} movimento${g.n===1?'':'i'}</div>
      </div>

      <div class="hint" style="text-transform:uppercase;letter-spacing:.05em;font-weight:660;margin-bottom:7px">${ent?'Da chi arriva':'Sotto-voci'}</div>
      <div style="margin-bottom:18px">
        ${sub.length ? sub.map(s => `<div class="rowbar" style="grid-template-columns:130px 1fr 90px;margin-bottom:5px">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(s.k)}">${esc(s.k)}</span>
          <span class="track"><span class="fill" style="width:${pct(s.v,maxSub)}%;background:${col}"></span></span>
          <span class="num">${eur(s.v)}</span></div>`).join('') : `<div class="hint">Nessun movimento nel periodo.</div>`}
      </div>

      <div class="hint" style="text-transform:uppercase;letter-spacing:.05em;font-weight:660;margin-bottom:7px">
        Andamento (4 periodi di confronto)</div>
      <div style="display:flex;gap:8px;margin-bottom:18px">
        ${cols.map(c => { const v = valCol(c), h = Math.max(pct(v,maxCol),v>0?4:0);
          return `<div style="flex:1;text-align:center">
            <div style="height:56px;display:flex;align-items:flex-end;justify-content:center">
              <div style="width:64%;height:${h}%;background:${col};border-radius:3px 3px 0 0"
                title="${esc(c.et)}: ${eur(v)}"></div></div>
            <div class="hint" style="margin-top:3px">${esc(c.et)}</div>
            <div class="n" style="font-size:11px">${v?eur(v):'·'}</div></div>`;
        }).join('')}
      </div>

      <div class="hint" style="text-transform:uppercase;letter-spacing:.05em;font-weight:660;margin-bottom:7px">
        ${ent?'Accrediti più alti':'Spese più alte'}${l.length>20?` (prime 20 di ${l.length})`:''}</div>
      <div style="border:1px solid var(--line2);border-radius:6px;overflow:hidden">
        ${top.map(t => `<div style="display:flex;justify-content:space-between;gap:8px;padding:7px 10px;
            border-bottom:1px solid var(--line3);cursor:pointer" onclick="apriPannelloMovimento('${esc(t.key)}')">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            <span class="hint n" style="margin-right:7px">${dmy(t.data)}</span>${esc(t.merchant||t.descrizione.slice(0,44))}</span>
          <span class="num ${ent?'pos':'neg'}" style="white-space:nowrap;flex:none">${eur2(imp(t))}</span></div>`).join('')}
        ${!top.length ? '<div class="empty">Nessun movimento nel periodo.</div>' : ''}
      </div>
    </div>
    <div class="pft">
      <button class="btn pri" onclick="vaiInAnalisiCategoria('${escJs(macro)}',${ent})">Vedi tutto in Analisi →</button>
    </div>`;
}
function vaiInAnalisiCategoria(macro, ent){
  chiudiPannello(true);
  if (ent){
    // Analisi filtra per macro: per una voce di entrata si filtra la macro che
    // la contiene e si raggruppa per voce, cosi' la riga cercata e' la prima.
    const t = S.tx.find(x => (x.sub || x.macro) === macro && x.tipo === 'Entrata');
    S.filtri.categoria = t ? t.macro : null; S.raggrAnalisi = 'sub';
  } else {
    S.filtri.categoria = macro; S.raggrAnalisi = 'categoria';
  }
  go('analisi');
}

carica();
</script>
