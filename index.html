<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanze GC</title>
<!-- Presenti anche quando la pagina è servita in locale: manifest e icone esistono
     solo dentro pubblica/ (§1), qui restano link innocui che il browser ignora
     con un 404 silenzioso se non trovati. Niente service worker: metterebbe in
     cache dati finanziari sul telefono, una copia in chiaro fuori dalla cartella. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.svg">
<meta name="theme-color" content="#2159C4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanze GC">
<style>
:root{
  --gc:#158A4C; --vt:#C22D25; --coppia:#2159C4; --tutto:#5B6470;
  --ink:#12181f; --ink2:#404b58; --ink3:#78838f; --ink4:#9aa4af;
  --line:#d8dee6; --line2:#eaeef3; --line3:#f2f5f8;
  --bg:#eef1f5; --card:#fff; --head:#f8fafc;
  --ok:#158A4C; --warn:#B36A00; --bad:#C22D25;
  --amber:#FFF7E3; --amberline:#E3BE6A;
  --accent:var(--coppia); --accent-soft:rgba(33,89,196,.08);
  --num:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:14px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:650}
button{font:inherit;cursor:pointer}
select,input{font:inherit;color:var(--ink)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ================= header ================= */
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60;
  box-shadow:0 1px 3px rgba(18,24,31,.05)}
.hrow{display:flex;align-items:center;gap:12px;padding:7px 18px}
.badge-persona{display:flex;align-items:center;gap:7px;border:1.5px solid var(--accent);color:var(--accent);
  background:var(--accent-soft);border-radius:7px;padding:5px 11px;font-weight:660;font-size:12.5px;position:relative}
.badge-persona .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.badge-persona .car{font-size:8px;opacity:.65}
.menu{position:absolute;top:calc(100% + 5px);left:0;background:var(--card);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 8px 26px rgba(18,24,31,.16);padding:4px;min-width:180px;display:none;z-index:70}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:7px 10px;
  border-radius:5px;text-align:left;color:var(--ink);font-size:12.5px}
.menu button:hover{background:var(--line2)}
.menu .dot{width:8px;height:8px;border-radius:50%}
nav{display:flex;gap:1px;margin-left:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:6px 11px;border-radius:6px;color:var(--ink2);font-size:12.5px;font-weight:540}
nav button:hover{background:var(--line2)}
nav button.on{background:var(--accent);color:#fff;font-weight:620}
nav button .cnt{display:inline-block;margin-left:5px;background:var(--bad);color:#fff;border-radius:8px;
  padding:0 5px;font-size:10.5px;font-weight:700;vertical-align:1px}
nav button.on .cnt{background:rgba(255,255,255,.3)}
.spacer{flex:1}
.alert-cp{display:none;align-items:center;gap:5px;background:var(--bad);color:#fff;border:0;border-radius:6px;
  padding:4px 10px;font-size:11.5px;font-weight:640}
.alert-cp.on{display:inline-flex}
.hint{color:var(--ink3);font-size:12.5px}

/* ================= layout ================= */
main{padding:12px 18px 50px;max-width:1920px;margin:0 auto}
.bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
  border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 10px;font-size:12px;color:var(--ink2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--line3)}
.seg button.on{background:var(--accent);color:#fff;font-weight:620}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:6px;padding:3px 4px 3px 9px;font-size:13px;color:var(--accent)}
.pill b{font-weight:650}
.pill .x{border:0;background:rgba(0,0,0,.07);border-radius:4px;width:16px;height:16px;line-height:14px;
  color:inherit;font-size:12px;padding:0}
.pill .x:hover{background:var(--bad);color:#fff}
select.f{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 7px;font-size:13px;color:var(--ink2)}
input.srch{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;width:210px}
table.leg2{font-size:13px}
table.leg2 th{font-size:10px;padding:4px 8px}
table.leg2 th.sm,table.leg2 td.sm{font-size:11.5px;width:74px}
table.leg2 td{padding:5px 8px;border-bottom:1px solid var(--line3)}
table.leg2 tbody tr:hover td{background:var(--line3)}
table.leg2 tr.tot td{background:var(--head);font-weight:680;border-top:1px solid var(--line);border-bottom:0}
table.leg2 tr.tot:hover td{background:var(--head)}
.saldi{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);
  border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:8px;
  padding:9px 14px;margin-bottom:10px;cursor:pointer}
.saldi:hover{background:var(--line3)}
.saldi.vuota{border-left-color:var(--line)}
.saldi .et{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;font-weight:660}
.saldi .tot{font-size:21px;font-weight:680;font-family:var(--num);letter-spacing:-.02em}
.saldi .cnt{display:inline-flex;flex-direction:column;line-height:1.25;padding:0 11px;
  border-left:1px solid var(--line2)}
.saldi .cnt .n2{font-size:10.5px;color:var(--ink3)}
.saldi .cnt b{font-size:13.5px;font-family:var(--num)}
.saldi .vai{font-size:11.5px;color:var(--accent);font-weight:600;white-space:nowrap}
.datebox{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:6px;padding:2px 7px;font-size:12px;color:var(--ink3)}
.datebox.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.datebox label{display:inline-flex;align-items:center;gap:4px}
.datebox input{border:0;background:transparent;font-size:12.5px;color:var(--ink);padding:2px 0;
  font-family:var(--num);width:118px}
.datebox.on input{color:var(--accent);font-weight:600}
.datebox .x{border:0;background:rgba(0,0,0,.08);border-radius:4px;width:17px;height:17px;line-height:15px;
  color:inherit;font-size:12px;padding:0;cursor:pointer}
.datebox .x:hover{background:var(--bad);color:#fff}

.grid{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.card>.hd{display:flex;align-items:center;gap:8px;padding:8px 13px;border-bottom:1px solid var(--line2);background:var(--head);
  border-radius:8px 8px 0 0}
.card>.hd h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:680}
.card>.bd{padding:12px 13px}
.card>.bd.flush{padding:0}

/* ================= metriche ================= */
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:10px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;position:relative;overflow:hidden}
.metric::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mc,var(--line))}
.metric .lab{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;font-weight:640}
.metric .val{font-size:22px;font-weight:680;letter-spacing:-.025em;margin-top:2px;font-family:var(--num);
  font-variant-numeric:tabular-nums;line-height:1.15}
.metric .sub{font-size:11px;color:var(--ink3);margin-top:1px}
.pos{color:var(--ok)} .neg{color:var(--bad)} .mut{color:var(--ink3)}

/* ================= tabelle ================= */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:660;color:var(--ink3);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  padding:6px 9px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--head);z-index:2}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink2)}
th.sortable.sorted{color:var(--accent)}
th.sortable .arr{margin-left:3px;font-size:9px}
td{padding:3px 9px;border-bottom:1px solid var(--line3);vertical-align:middle}
tbody tr:hover td{background:var(--line3)}
tr.conflitto td{background:var(--amber)}
td.num,th.num{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
td.desc{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{max-height:64vh;overflow:auto}
td select{border:1px solid transparent;background:transparent;border-radius:4px;padding:1px 3px;font-size:12px;max-width:100%}
td select:hover{border-color:var(--line);background:var(--card)}
td select.man{border-color:var(--accent);background:var(--accent-soft)}
td input.ed{border:1px solid transparent;background:transparent;border-radius:4px;padding:1px 3px;font:inherit;color:inherit;width:100%}
td input.ed:hover,td input.ed:focus{border-color:var(--line);background:var(--card)}
td input.ed.man{border-color:var(--accent);background:var(--accent-soft)}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10.5px;font-weight:650;letter-spacing:.02em}
.tag.gc{background:rgba(21,138,76,.12);color:var(--gc)}
.tag.vt{background:rgba(194,45,37,.11);color:var(--vt)}
.tag.coppia{background:rgba(33,89,196,.11);color:var(--coppia)}
.tag.ok{background:rgba(21,138,76,.12);color:var(--ok)}
.tag.no{background:rgba(194,45,37,.11);color:var(--bad)}
.tag.wa{background:rgba(179,106,0,.13);color:var(--warn)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;flex:none}
.ico{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;flex:none;
  vertical-align:middle}
.ico svg{fill:currentColor;display:block}
.eu{font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.legrow{display:flex;align-items:center;gap:11px;padding:8px 7px;border-radius:6px;cursor:pointer;
  border-bottom:1px solid var(--line3)}
.legrow:last-child{border-bottom:0}
.legrow:hover{background:var(--line3)}
.legrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:540}
.legrow .pc{width:46px;text-align:right;font-family:var(--num);color:var(--ink3);font-size:13px}

/* ================= drill-down ================= */
.tree{font-size:12.5px}
.tnode{display:grid;grid-template-columns:22px 1fr 132px 116px 104px 46px 58px 92px;gap:8px;align-items:center;
  padding:4px 12px;border-bottom:1px solid var(--line3);cursor:pointer}
.tnode:hover{background:var(--line3)}
.tnode .car{color:var(--ink4);font-size:9px;transition:transform .12s;text-align:center}
.tnode.open>.car{transform:rotate(90deg)}
.tnode .nm{display:flex;align-items:center;gap:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:560}
.tnode .track{background:var(--line2);border-radius:2px;height:12px;overflow:hidden}
.tnode .track i{display:block;height:100%;border-radius:2px}
.tnode.l2{padding-left:32px;background:#fcfdfe;font-size:12px}
.tnode.l2 .nm{font-weight:480;color:var(--ink2)}
.tleaf{display:grid;grid-template-columns:22px 78px 1fr 150px 130px 104px;gap:8px;align-items:center;
  padding:3px 12px 3px 56px;border-bottom:1px solid var(--line3);font-size:12px;background:#fafcfe;cursor:pointer}
.tleaf:hover{background:var(--line2)}
.tleaf:hover .edit{opacity:1}
.tleaf .dsc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.tleaf .cat{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--ink3)}
.tleaf .edit{opacity:0;transition:opacity .12s;font-size:10.5px;color:var(--accent);font-weight:640}
.sparkwrap{line-height:0}
.tmore{padding:5px 12px 7px 56px;font-size:11.5px;background:#fafcfe;border-bottom:1px solid var(--line3)}

/* ================= barre / chart ================= */
.rowbar{display:grid;grid-template-columns:150px 1fr 88px;gap:8px;align-items:center;margin-bottom:4px;font-size:12.5px}
.track{background:var(--line2);border-radius:3px;height:14px;overflow:hidden}
.fill{height:100%;border-radius:3px}
.legend{display:flex;flex-direction:column;gap:4px}
.leg{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:2px 4px;border-radius:4px;cursor:pointer}
.leg:hover{background:var(--line3)}
.leg .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg .vv{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:620}
/* ================= da verificare ================= */
.vrow{display:grid;grid-template-columns:74px 1fr 92px 250px 108px;gap:9px;align-items:center;
  padding:7px 11px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px;background:var(--card)}
.vrow .d{font-size:11.5px;color:var(--ink3);font-family:var(--num)}
.vrow .t{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .t small{display:block;color:var(--ink3);font-size:11px}
.vrow select{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12.5px;background:var(--card)}
.vrow input{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12.5px;background:var(--card);font-family:inherit;color:inherit}
.vrow .sugg{border-color:var(--accent);background:var(--accent-soft)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 11px;font-size:12.5px;
  color:var(--ink);font-weight:560}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.09)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:11.5px}

/* ================= modale ================= */
.ovl{position:fixed;inset:0;background:rgba(18,24,31,.44);display:none;align-items:center;justify-content:center;z-index:100}
.ovl.on{display:flex}
.modal{background:var(--card);border-radius:10px;padding:19px 21px;max-width:540px;width:92%;
  box-shadow:0 20px 54px rgba(18,24,31,.3)}
.modal h2{font-size:15.5px;margin-bottom:7px}
.modal p{color:var(--ink2);margin:0 0 13px}
.modal .acts{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:7px;font-size:12.5px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--ink3);padding:34px 10px}
.warnbox{background:var(--amber);border:1px solid var(--amberline);border-radius:7px;padding:9px 12px;
  margin-bottom:10px;font-size:12.5px}

/* ================= pannello scorrevole (Lavoro 2/3) ================= */
.povl{position:fixed;inset:0;background:rgba(18,24,31,0);pointer-events:none;z-index:150;
  transition:background .22s ease}
.povl.on{background:rgba(18,24,31,.4);pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:clamp(380px,48vw,720px);background:var(--card);
  box-shadow:-10px 0 34px rgba(18,24,31,.22);transform:translateX(100%);transition:transform .22s ease;
  display:flex;flex-direction:column}
.povl.on .panel{transform:translateX(0)}
.panel .phd{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;flex:none}
.panel .pbd{padding:16px 18px;flex:1;overflow-y:auto}
.panel .pft{padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;
  align-items:center;background:var(--head);flex:none}
.panel .pclose{border:0;background:none;font-size:20px;line-height:1;color:var(--ink3);cursor:pointer;
  padding:3px 8px;border-radius:5px}
.panel .pclose:hover{background:var(--line2);color:var(--ink)}
.panel label select,.panel label input{margin-top:3px}
@media(max-width:1400px){.metrics{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.vrow{grid-template-columns:1fr}.panel{width:100vw}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="badge-persona" id="badge" onclick="toggleMenu(event)">
      <span class="dot"></span><span id="badgeTxt">Coppia</span><span class="car">&#9660;</span>
      <div class="menu" id="menu">
        <button onclick="setPersona('GC',event)"><span class="dot" style="background:var(--gc)"></span>GC</button>
        <button onclick="setPersona('VT',event)"><span class="dot" style="background:var(--vt)"></span>VT</button>
        <button onclick="setPersona('Comuni',event)"><span class="dot" style="background:var(--coppia)"></span>CONDIVISE</button>
        <button onclick="setPersona('Tutto',event)"><span class="dot" style="background:var(--tutto)"></span>TOTALE</button>
      </div>
    </div>
    <nav id="nav"></nav>
    <span class="spacer"></span>
    <button class="alert-cp" id="alertCp" onclick="go('conti')">&#9888; <span id="alertCpTxt"></span></button>
    <span class="hint" id="hint"></span>
  </div>
</header>

<main id="view"><div class="card"><div class="empty">Caricamento…</div></div></main>

<div class="ovl" id="ovl"><div class="modal" id="modal"></div></div>
<div class="povl" id="povl"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================ stato */
const S = {
  tx: [], report: {}, tax: {}, ov: {movimenti:{},merchant_appresi:{}}, bal: {}, budget: {budget:{}},
  persona: 'Tutto', tab: 'panoramica',
  periodo: '6m', annoSel: null, meseSel: null, da: null, a: null,
  filtri: {sfera:null, immobile:null, viaggio:null, categoria:null},
  sort: {},                // stato ordinamento per tabella: {tabId: {col, dir}}
  conti: [],            // vuoto = tutti i conti; piu' voci = selezione multipla
  pending: {}, oggi: null, readonly: false,
  pubblicato: false, pubGeneratoIl: null,   // modalita' telefono: sbloccato da data.enc
  fVer: {cerca:'', persona:'', conto:''},   // filtri locali di "Da verificare"
  estrattoTutto: false,                    // estratto conto: mostra anche le spese di carta
  open: new Set(),          // nodi aperti del drill-down (Panoramica, compito 3)
  raggr: 'categoria',       // categoria | esercente (drill-down Panoramica)
  raggrAnalisi: 'categoria',  // raggruppamento della tabella Analisi (compito 2)
  openAnalisi: new Set(),     // gruppi espansi nella tabella Analisi
  cerca: '',
  pannello: null,   // {modo:'movimento', key, draft:{}} | {modo:'categoria', macro} | null
};
const TABS = [
  ['panoramica','Panoramica'], ['transazioni','Transazioni'], ['analisi','Analisi'],
  ['conti','Conti'], ['coppia','Coppia'], ['dati','Dati'],
  ['verificare','Da verificare']
];
const COL_PERSONA = {GC:'var(--gc)', VT:'var(--vt)', Comuni:'var(--coppia)', Tutto:'var(--tutto)'};
const RGB_PERSONA = {GC:'21,138,76', VT:'194,45,37', Comuni:'33,89,196', Tutto:'91,100,112'};
/* Etichette del selettore vista (Lavoro 4): solo il testo mostrato cambia, il
   valore interno resta GC/VT/Comuni/Tutto — quota()/pesi() non sanno nulla di
   questa mappa e non vanno toccate. */
const LABEL_PERSONA = {GC:'GC', VT:'VT', Comuni:'CONDIVISE', Tutto:'TOTALE'};

/* ============================================================ icone
   Tracciati SVG su griglia 24×24, disegnati a mano: nessuna libreria
   esterna, funziona anche senza rete. */

/* ============================================================ utility */
/* useGrouping:true forza il punto delle migliaia anche sotto le 10.000.
   Il default italiano (CLDR minimumGroupingDigits=2) scriverebbe "4680,00"
   accanto a "12.000,00": in colonna è illeggibile. */
const eur = (n,d=0) => (n<0?'−':'') + Math.abs(n)
  .toLocaleString('it-IT',{minimumFractionDigits:d, maximumFractionDigits:d, useGrouping:true}) + ' €';
const eur2 = n => eur(n,2);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* esc() non tocca l'apostrofo: dentro un onclick='...' servirebbe. */
const escJs = s => esc(s).replace(/'/g, '&#39;');
const mesiIt = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const labelMese = m => mesiIt[+m.slice(5)-1] + ' ' + m.slice(0,4);
const dmy = d => d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4);
const pct = (a,b) => b ? (a/b*100) : 0;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2400); }
function shiftMese(m,n){ let y=+m.slice(0,4), mm=+m.slice(5)-n; while(mm<1){mm+=12;y--;} while(mm>12){mm-=12;y++;}
  return y+'-'+String(mm).padStart(2,'0'); }
const idSafe = s => String(s).replace(/[^A-Za-z0-9]/g,'_');

/* Selettore a quattro voci (STRUTTURA.md): GC e VT sommano il proprio più
   metà del comune; Comuni mostra solo il condiviso; Tutto non pesa nulla. */
function quota(t){
  switch (S.persona){
    case 'Tutto':  return 1;
    case 'Comuni': return t.persona === 'Coppia' ? 1 : 0;
    case 'GC':     return t.persona === 'GC' ? 1 : (t.persona === 'Coppia' ? 0.5 : 0);
    case 'VT':     return t.persona === 'VT' ? 1 : (t.persona === 'Coppia' ? 0.5 : 0);
    default:       return 0;
  }
}
const imp = t => t.importo * quota(t);
/* Scomposizione Proprie / Quota comuni di quota(t): ha senso solo nelle viste
   GC e VT. Nelle altre due il totale coincide con "proprie" per costruzione,
   cosi' l'invariante proprie+comuni=totale resta vera ovunque (§STRUTTURA). */
function pesi(t){
  if (S.persona === 'GC') return {proprie: t.persona==='GC'?1:0, comuni: t.persona==='Coppia'?0.5:0};
  if (S.persona === 'VT') return {proprie: t.persona==='VT'?1:0, comuni: t.persona==='Coppia'?0.5:0};
  return {proprie: quota(t), comuni: 0};
}
/* {proprie, comuni, totale} su una lista, con lo stesso segno di somma()/imp() */
function sommaScomposta(lista){
  let proprie = 0, comuni = 0;
  lista.forEach(t => { const p = pesi(t); proprie += t.importo * p.proprie; comuni += t.importo * p.comuni; });
  return {proprie, comuni, totale: proprie + comuni};
}

/* ============================================================ periodo */
function rangePeriodo(){
  const oggi = S.oggi, annoOggi = +oggi.slice(0,4), meseOggi = oggi.slice(0,7);
  switch(S.periodo){
    case 'mese':   return [meseOggi+'-01', oggi, labelMese(meseOggi)];
    case '3m':     return [shiftMese(meseOggi,2)+'-01', oggi, 'Ultimi 3 mesi'];
    case '6m':     return [shiftMese(meseOggi,5)+'-01', oggi, 'Ultimi 6 mesi'];
    case 'ytd':    return [annoOggi+'-01-01', oggi, 'Anno corrente ('+annoOggi+')'];
    case '12m':    return [shiftMese(meseOggi,11)+'-01', oggi, 'Ultimi 12 mesi'];
    case 'anno':   return [S.annoSel+'-01-01', S.annoSel+'-12-31', 'Anno '+S.annoSel];
    case 'mesean': return [S.meseSel+'-01', S.meseSel+'-31', labelMese(S.meseSel)];
    case 'pers': {
      const d = S.da || '0000-01-01', a = S.a || '9999-12-31';
      const et = (S.da && S.a) ? `${dmy(S.da)} → ${dmy(S.a)}`
               : S.da ? `dal ${dmy(S.da)}` : S.a ? `fino al ${dmy(S.a)}` : 'Periodo libero';
      return d <= a ? [d, a, et] : [a, d, et];    // date invertite: le rimetto in ordine
    }
    default:       return ['0000-01-01','9999-12-31','Tutto lo storico'];
  }
}
function periodoPrec(){
  const [d,a] = rangePeriodo();
  const md = d.slice(0,7), ma = a.slice(0,7);
  const n = (+ma.slice(0,4)*12 + +ma.slice(5)) - (+md.slice(0,4)*12 + +md.slice(5)) + 1;
  return [shiftMese(md,n)+'-01', shiftMese(ma,n)+'-31'];
}

/* ============================================================ selezione */
function passaFiltri(t){
  const f = S.filtri;
  if (S.conti.length && !S.conti.includes(t.conto)) return false;
  if (f.sfera && t.sfera !== f.sfera) return false;
  if (f.immobile && t.immobile !== f.immobile) return false;
  if (f.viaggio && t.viaggio !== f.viaggio) return false;
  if (f.categoria && t.macro !== f.categoria) return false;
  if (S.cerca){
    const q = S.cerca.toUpperCase();
    if (!((t.merchant||'') + ' ' + t.descrizione).toUpperCase().includes(q)) return false;
  }
  return true;
}
function sel(opt={}){
  const [d,a] = opt.range || rangePeriodo();
  return S.tx.filter(t => t.data >= d && t.data <= a && passaFiltri(t) && quota(t) > 0);
}
const spese   = l => l.filter(t => t.tipo === 'Spesa');
const entrate = l => l.filter(t => t.tipo === 'Entrata');
const somma   = l => l.reduce((s,t) => s + imp(t), 0);
/* Aggrega una lista per chiave, con la scomposizione proprie/comuni oltre al
   totale: e' la base comune per legenda ciambella, metriche e (compito 2)
   la tabella di Analisi. */
/* Somma CON SEGNO e prende il modulo alla fine, non movimento per movimento.
   Prendendolo prima, un rimborso dentro una macro di spesa (+322,45 su TEMPO
   LIBERO) veniva sommato come se fosse una spesa: la ciambella diceva 89.187 €
   e la tabella accanto 88.542 €, con lo scarto pari al doppio del rimborso.
   Le parti devono risommare al totale (§7 punto 4). */
function aggrega(lista, fnChiave){
  const m = {};
  lista.forEach(t => { const k = fnChiave(t);
    (m[k] = m[k] || {k, v:0, proprie:0, comuni:0, n:0, tx:[]});
    const p = pesi(t);
    m[k].proprie += t.importo * p.proprie;
    m[k].comuni  += t.importo * p.comuni;
    m[k].v += imp(t); m[k].n++; m[k].tx.push(t); });
  // netto conserva il segno, v e' la grandezza per barre e ordinamenti. Servono
  // entrambi: una categoria puo' NETTARE POSITIVO dentro le uscite quando i
  // rimborsi superano le spese (vista VT, TEMPO LIBERO: -153,61 di spese contro
  // +322,45 di rimborso = +168,84). Prendendo solo il modulo quella categoria
  // si sommerebbe invece di sottrarsi, e le parti non tornerebbero piu' al totale.
  return Object.values(m)
    .map(g => Object.assign(g, {netto:g.v, v:Math.abs(g.v),
                                proprie:Math.abs(g.proprie), comuni:Math.abs(g.comuni)}))
    .filter(g => g.v > 0.005).sort((a,b) => b.v - a.v);
}
function perMacro(lista){
  return aggrega(spese(lista), t => t.macro).map(g => [g.k, g.v, g.proprie, g.comuni, g.netto]);
}
/* Le entrate stanno quasi tutte in una sola macro (ENTRATE): raggrupparle per
   macro darebbe una fetta unica e nessuna informazione. L'asse che dice
   qualcosa e' la voce: Stipendio, Fatturato P.IVA, Affitti attivi, Rimborsi. */
function perVoceEntrate(lista){
  return aggrega(entrate(lista), t => t.sub || t.macro).map(g => [g.k, g.v, g.proprie, g.comuni]);
}

          Rigenerala aprendo <b>Avvia Finanze GC.bat</b>.</p></div></div>`;
      }
    }
  }
}

/* ============================================================ pubblicazione cifrata
   §1 (autorizzato da GC in chat, 2026-08-02): i dati possono uscire dalla cartella
   SOLO cifrati. Cifratura/decifratura fatte esclusivamente con WebCrypto (nessun
   algoritmo scritto a mano, nessuna libreria importata). Formato del file .enc:
     byte 0-3   "FGC1" (magic)
     byte 4     versione (1)
     byte 5     flag: 1 = corpo compresso con gzip, 0 = no
     byte 6-21  salt PBKDF2 (16 byte, in chiaro: non e' un segreto)
     byte 22-33 IV di AES-GCM (12 byte, in chiaro: non e' un segreto)
     byte 34-.. testo cifrato (AES-GCM, il tag di autenticazione e' incluso da WebCrypto) */
const PUB_MAGIC = [0x46,0x47,0x43,0x31];   // "FGC1"
const PUB_ITER = 300000;

async function pubDerivaChiave(passphrase, salt, uso){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase),
    'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations: PUB_ITER, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, [uso]);
}
async function pubComprimi(stringa){
  const grezzo = new TextEncoder().encode(stringa);
  if (typeof CompressionStream === 'undefined') return {corpo: grezzo, compresso: false};
  const cs = new CompressionStream('gzip');
  const scrittore = cs.writable.getWriter();
  scrittore.write(grezzo); scrittore.close();
  const buf = await new Response(cs.readable).arrayBuffer();
  return {corpo: new Uint8Array(buf), compresso: true};
}
async function pubDecomprimi(bytes, compresso){
  if (!compresso) return new TextDecoder().decode(bytes);
  const ds = new DecompressionStream('gzip');
  const scrittore = ds.writable.getWriter();
  scrittore.write(bytes); scrittore.close();
  const buf = await new Response(ds.readable).arrayBuffer();
  return new TextDecoder().decode(buf);
}
/* Cifra un oggetto JS in un Uint8Array pronto per essere pubblicato. */
async function pubCifra(oggetto, passphrase){
  const {corpo, compresso} = await pubComprimi(JSON.stringify(oggetto));
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const chiave = await pubDerivaChiave(passphrase, salt, 'encrypt');
  const cifrato = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, chiave, corpo));
  const header = new Uint8Array(34);
  header.set(PUB_MAGIC, 0);
  header[4] = 1; header[5] = compresso ? 1 : 0;
  header.set(salt, 6); header.set(iv, 22);
  const out = new Uint8Array(header.length + cifrato.length);
  out.set(header, 0); out.set(cifrato, header.length);
  return out;
}
/* Decifra: lancia un errore con messaggio 'PASSPHRASE_ERRATA' se la passphrase
   e' sbagliata o il file e' corrotto (AES-GCM non verifica -> eccezione nativa). */
async function pubDecifra(bytes, passphrase){
  if (!(bytes instanceof Uint8Array)) bytes = new Uint8Array(bytes);
  if (bytes.length < 34 || !PUB_MAGIC.every((b,i) => bytes[i] === b))
    throw new Error('FORMATO_NON_RICONOSCIUTO');
  const compresso = bytes[5] === 1;
  const salt = bytes.slice(6,22), iv = bytes.slice(22,34), corpoCifrato = bytes.slice(34);
  const chiave = await pubDerivaChiave(passphrase, salt, 'decrypt');
  let corpo;
  try { corpo = await crypto.subtle.decrypt({name:'AES-GCM', iv}, chiave, corpoCifrato); }
  catch(e){ throw new Error('PASSPHRASE_ERRATA'); }
  const testo = await pubDecomprimi(new Uint8Array(corpo), compresso);
  return JSON.parse(testo);
}

/* ---------- modalita' telefono: schermata di sblocco ---------- */
function mostraSbloccoPubblicato(buf){
  S._pubBuf = buf;
  document.getElementById('view').innerHTML = `<div class="card" style="max-width:360px;margin:70px auto 0;padding:28px 26px;text-align:center">
    <h2 style="margin-bottom:5px">Finanze GC</h2>
    <p class="hint" style="margin-bottom:18px">Copia pubblicata e cifrata. Inserisci la passphrase per aprirla.</p>
    <input id="sbloccoPass" type="password" placeholder="Passphrase" autofocus
      style="width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;text-align:center;font-size:15px;box-sizing:border-box"
      onkeydown="if(event.key==='Enter'){provaSblocco();}">
    <div id="sbloccoErr" class="hint" style="color:var(--bad);margin-top:9px;min-height:15px"></div>
    <button class="btn pri" style="width:100%;margin-top:8px" onclick="provaSblocco()">Sblocca</button>
  </div>`;
  document.getElementById('sbloccoPass')?.focus();
}
async function provaSblocco(){
  const inp = document.getElementById('sbloccoPass');
  const err = document.getElementById('sbloccoErr');
  const pass = inp.value;
  if (!pass){ err.textContent = 'Inserisci la passphrase.'; return; }
  err.textContent = 'Verifica…';
  try {
    const dati = await pubDecifra(S._pubBuf, pass);
    S.pubGeneratoIl = dati.generato_il || null;
    applica(dati);
  } catch(e){
    err.textContent = e.message === 'FORMATO_NON_RICONOSCIUTO'
      ? 'File non riconosciuto: la pubblicazione potrebbe essere corrotta.'
      : 'Passphrase errata.';
    inp.value = ''; inp.focus();
  }
}
function caricaScript(src){
  return new Promise((ok,ko) => { const s=document.createElement('script');
    s.src=src; s.onload=ok; s.onerror=()=>ko(new Error('no '+src)); document.head.appendChild(s); });
}
function applica(d){
  S.tx = d.transactions || []; S.report = d.report || {}; S.tax = d.taxonomy || {};
  S.ov = d.overrides || {movimenti:{},merchant_appresi:{}}; S.bal = d.balances || {};
  S.budget = d.budget || {}; if (!S.budget.budget) S.budget.budget = {};
  S.ultimoImport = d.ultimo_import || S.ultimoImport || null;
  S.oggi = S.tx.reduce((m,t) => t.data > m ? t.data : m, '0000-00-00');
  if (!S.annoSel) S.annoSel = +S.oggi.slice(0,4);
  if (!S.meseSel) S.meseSel = S.oggi.slice(0,7);
  render();
}
async function post(url, body){
  if (S.readonly) { avvisoSolaLettura(); return null; }
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const d = await r.json();
  if (d.ok === false) { toast('Errore nel rebuild — controlla il terminale'); console.error(d.log); }
  applica(d);
  return d;
}

/* ---------- barra periodo + filtri ---------- */
function barraPeriodo(conFiltri, conCerca){
  const anni = [...new Set(S.tx.map(t => t.anno))].sort((a,b) => b-a);
  const mesi = [...new Set(S.tx.map(t => t.mese))].sort().reverse();
  const P = [['mese','Mese'],['3m','3 mesi'],['6m','6 mesi'],['ytd','YTD'],['12m','12 mesi'],['tutto','Tutto']];
  let h = `<div class="bar"><div class="seg">` +
    P.map(([k,l]) => `<button class="${S.periodo===k?'on':''}" onclick="setPeriodo('${k}')">${l}</button>`).join('') +
    `</div>
    <select class="f" onchange="if(this.value){S.periodo='anno';S.annoSel=+this.value;render()}">
      <option value="">Anno…</option>${anni.map(a=>`<option ${S.periodo==='anno'&&S.annoSel===a?'selected':''}>${a}</option>`).join('')}
    </select>
    <select class="f" onchange="if(this.value){S.periodo='mesean';S.meseSel=this.value;render()}">
      <option value="">Mese…</option>${mesi.map(m=>`<option value="${m}" ${S.periodo==='mesean'&&S.meseSel===m?'selected':''}>${labelMese(m)}</option>`).join('')}
    </select>
    <span class="datebox ${S.periodo==='pers'?'on':''}">
      <label>dal <input type="date" value="${esc(S.da||'')}" max="${esc(S.oggi||'')}"
        onchange="setDataLibera('da',this.value)"></label>
      <label>al <input type="date" value="${esc(S.a||'')}" max="${esc(S.oggi||'')}"
        onchange="setDataLibera('a',this.value)"></label>
      ${(S.da||S.a) ? `<button class="x" title="Azzera il periodo libero" onclick="azzeraDate()">×</button>` : ''}
    </span>
    <span class="hint">${rangePeriodo()[2]}</span>`;
  if (conCerca) h += `<input class="srch" id="srch" placeholder="Cerca esercente…" value="${esc(S.cerca)}"
      oninput="clearTimeout(window._sd);window._sd=setTimeout(()=>setCerca(this.value),260)">`;
  if (conFiltri){
    h += `<span class="spacer"></span>`;
    h += pillOrSelect('categoria','Categoria',macroSelezionabili().map(([m])=>m).sort());
    h += pillOrSelect('sfera','Sfera',['Privata','P.IVA']);
    h += pillOrSelect('immobile','Immobile',S.tax.immobili||[]);
    h += pillOrSelect('viaggio','Viaggio',[...new Set(S.tx.map(t=>t.viaggio).filter(Boolean))].sort());
    if (S.cerca) h += `<span class="pill">Cerca: <b>${esc(S.cerca)}</b><button class="x" onclick="setCerca('')">×</button></span>`;
  } else {
    // Anche dove non offriamo le tendine, i filtri attivi DEVONO restare visibili
    // e rimovibili: un filtro che agisce senza mostrarsi è la cosa peggiore in
    // un'applicazione di analisi. Prima la Panoramica ne era priva e chi arrivava
    // da Analisi restava bloccato su una categoria senza capire perché.
    h += pillAttive();
  }
  h += `</div>`;
  return h + (conFiltri ? barraConti() : barraContiAttivi());
}
/* Pillole di sola rimozione per i filtri attivi, senza le tendine per impostarli. */
function pillAttive(){
  const et = {categoria:'Categoria', sfera:'Sfera', immobile:'Immobile', viaggio:'Viaggio'};
  let h = '';
  for (const k in et) if (S.filtri[k])
    h += `<span class="pill">${et[k]}: <b>${esc(S.filtri[k])}</b>
      <button class="x" title="Togli il filtro" onclick="setFiltro('${k}',null)">×</button></span>`;
  if (S.cerca) h += `<span class="pill">Cerca: <b>${esc(S.cerca)}</b>
    <button class="x" onclick="setCerca('')">×</button></span>`;
  return h;
}

/* ---------- ordinamento tabelle: stato per tabId, colonne cliccabili ---------- */
function ordina(tabId, lista, colonne, defCol, defDir){
  const s = S.sort[tabId] || {col: defCol, dir: defDir};
  S.sort[tabId] = s;
  const get = colonne[s.col] || colonne[defCol];
  const dir = s.dir === 'asc' ? 1 : -1;
  return [...lista].sort((a,b) => {
    let av = get(a), bv = get(b);
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av < bv) return -1 * dir;
    if (av > bv) return 1 * dir;
    return 0;
  });
}
function setSort(tabId, col, defDir){
  const s = S.sort[tabId] || {};
  if (s.col === col) s.dir = s.dir === 'asc' ? 'desc' : 'asc';
  else { s.col = col; s.dir = defDir || 'asc'; }
  S.sort[tabId] = s;
  render();
}
function thSort(tabId, label, col, defDir, cls){
  const s = S.sort[tabId] || {};
  const attivo = s.col === col;
  const frecc = attivo ? `<span class="arr">${s.dir==='asc'?'▲':'▼'}</span>` : '';
  return `<th class="sortable${cls?' '+cls:''}${attivo?' sorted':''}"
    onclick="setSort('${tabId}','${col}','${defDir||'asc'}')">${esc(label)}${frecc}</th>`;
}
function pillOrSelect(k,label,opts){
  if (S.filtri[k]) return `<span class="pill">${label}: <b>${esc(S.filtri[k])}</b>
    <button class="x" onclick="setFiltro('${k}',null)">×</button></span>`;
  if (!opts.length) return '';
  return `<select class="f" onchange="setFiltro('${k}',this.value)"><option value="">${label}: tutti</option>` +
    opts.map(o=>`<option>${esc(o)}</option>`).join('') + `</select>`;
}

/* Il saldo è uno STOCK: una fotografia a una data. Entrate, uscite e risparmio sono
   FLUSSI: dipendono dal periodo. Messi sulla stessa riga, cambiare periodo muove gli
   uni e non l'altro, e sembra che qualcosa sia rotto. Sta quindi in una striscia sua,
   con la data a cui si riferisce, e porta alla scheda Conti. */
/* Quattro periodi di confronto accanto al totale. L'unità segue la selezione: se il
   periodo copre più di un anno le colonne sono anni, altrimenti mesi. Un numero da
   solo non dice niente; accanto ai tre precedenti dice se stai salendo o scendendo. */
function colonneConfronto(){
  const [d,a] = rangePeriodo();
  const fine = (a > S.oggi ? S.oggi : a);
  const perAnni = (+fine.slice(0,4) - +d.slice(0,4)) >= 1;
  const cols = [];
  if (perAnni){
    const y = +fine.slice(0,4);
    for (let i=3; i>=0; i--) cols.push({et:String(y-i), da:`${y-i}-01-01`, a:`${y-i}-12-31`});
  } else {
    const m0 = fine.slice(0,7);
    for (let i=3; i>=0; i--){ const m = shiftMese(m0,i);
      cols.push({et:labelMese(m).replace(' 20',"'"), da:m+'-01', a:m+'-31'}); }
  }
  cols.forEach(c => {
    const l = sel({range:[c.da,c.a]});
    c.perMacro = Object.fromEntries(perMacro(l).map(([k,v]) => [k,v]));
    c.tot = Object.values(c.perMacro).reduce((s,v)=>s+v,0);
    c.perVoceEnt = Object.fromEntries(perVoceEntrate(l).map(([k,v]) => [k,v]));
    c.totEnt = Object.values(c.perVoceEnt).reduce((s,v)=>s+v,0);
  });
  return cols;
}
/* Simmetrica alla ripartizione delle uscite, ma senza ciambella: le voci di
   entrata sono poche e molto sbilanciate (lo stipendio da solo fa la maggior
   parte), e su una ciambella diventerebbero fette invisibili. Una barra unica
   in proporzione dice la stessa cosa e si legge meglio. */
function cardEntrate(cols){
  const l = sel(), en = entrate(l), tot = somma(en);
  if (!en.length) return card('Da dove arrivano le entrate',
    `<div class="empty">Nessuna entrata nel periodo selezionato.</div>`);
  const scomponi = S.persona === 'GC' || S.persona === 'VT';
  const voci = perVoceEntrate(l).map(([k,v,proprie,comuni],i) => ({k,v,proprie,comuni,c:coloreEntrata(i)}));
  const barra = voci.map(f => `<span title="${esc(f.k)}: ${eur(f.v)} (${pct(f.v,tot).toFixed(1)}%) — clicca per il dettaglio"
      onclick="apriVoceEntrata('${escJs(f.k)}')"
      style="width:${pct(f.v,tot)}%;background:${f.c};display:block;height:100%;cursor:pointer"></span>`).join('');
  return card('Da dove arrivano le entrate', `
    <div style="display:flex;height:26px;border-radius:6px;overflow:hidden;margin-bottom:11px;
      border:1px solid var(--line2)">${barra}</div>
    <table class="leg2"><thead><tr>
      <th colspan="2">Voce</th>
      ${scomponi ? '<th class="num">Proprie</th><th class="num">Quota comuni</th>' : ''}
      <th class="num">Totale</th><th class="num">%</th>
      ${cols.map(c=>`<th class="num sm">${esc(c.et)}</th>`).join('')}
    </tr></thead><tbody>
    ${voci.map(f => {
      const p = pct(f.v,tot), pmax = pct(f.v, voci[0].v);
      return `<tr onclick="apriVoceEntrata('${escJs(f.k)}')" style="cursor:pointer"
          title="${esc(f.k)}: clicca per il dettaglio">
        <td style="width:34px"><span style="display:inline-block;width:14px;height:14px;
          border-radius:4px;background:${f.c}"></span></td>
        <td><div style="font-weight:560">${esc(f.k)}</div>
          <span class="track" style="height:6px;width:${Math.max(pmax,2)}%;min-width:14px;display:block;
            background:${f.c};border-radius:3px;margin-top:3px"></span></td>
        ${scomponi ? `<td class="num mut">${eur(f.proprie)}</td><td class="num mut">${eur(f.comuni)}</td>` : ''}
        <td class="num pos">${eurRich(f.v, 15)}</td>
        <td class="num mut">${p<1?p.toFixed(1):p.toFixed(0)}%</td>
        ${cols.map(c=>{ const v=c.perVoceEnt[f.k]||0;
          return `<td class="num sm ${v?'':'mut'}">${v?eur(v):'·'}</td>`; }).join('')}
      </tr>`;
    }).join('')}
    <tr class="tot"><td></td><td>TOTALE</td>
      ${scomponi ? `<td class="num">${eur(voci.reduce((s,f)=>s+f.proprie,0))}</td>
                    <td class="num">${eur(voci.reduce((s,f)=>s+f.comuni,0))}</td>` : ''}
      <td class="num pos">${eurRich(tot, 15)}</td><td class="num">100%</td>
      ${cols.map(c=>`<td class="num sm">${c.totEnt?eur(c.totEnt):'·'}</td>`).join('')}
    </tr></tbody></table>`);
}

function strisciaSaldi(){
  const ap = S.bal.saldi_apertura || {};
  const conti = (S.report.conti || []).filter(c => ap[c.conto]?.importo != null &&
    (!S.conti.length || S.conti.includes(c.conto)));
  if (!conti.length) return `<div class="saldi vuota" onclick="go('conti')" title="Vai alla scheda Conti">
    <span class="et">Saldo liquido</span>
    <span class="hint">nessun saldo di apertura impostato — <b>impostane uno in Conti →</b></span></div>`;
  const tot = conti.reduce((s,c) => s + (c.saldo_teorico ?? 0), 0);
  const data = conti.map(c => c.data_apertura).filter(Boolean).sort().slice(-1)[0];
  return `<div class="saldi" onclick="go('conti')" title="Vai alla scheda Conti">
    <span class="et">Saldo liquido</span>
    <b class="tot ${tot>=0?'pos':'neg'}">${eur(tot)}</b>
    <span class="hint">teorico${data?`, dal saldo di apertura del ${dmy(data)}`:''}</span>
    <span class="spacer"></span>
    ${conti.map(c => `<span class="cnt"><span class="n2">${esc(c.conto)}</span>
      <b class="${(c.saldo_teorico??0)>=0?'pos':'neg'}">${eur(c.saldo_teorico)}</b></span>`).join('')}
    <span class="vai">dettaglio →</span></div>`;
}

/* ============================================================ PANORAMICA (compito 3) */
/* Riga di stato: cosa non va, in una riga sola e cliccabile (§STRUTTURA). */
function rigaStato(){
  const nDaVer = S.tx.filter(t => t.stato === 'Da verificare').length;
  const cp = (S.report.checkpoint||[]).filter(c => c.stato !== 'Verificato');
  const scartiCarta = (S.report.riconciliazione_carta||[]).filter(r => r.esito !== 'OK');
  const voci = [];
  if (nDaVer) voci.push(`<a href="#" onclick="event.preventDefault();go('verificare')">
    ⚠ ${nDaVer} ${nDaVer===1?'movimento':'movimenti'} da verificare</a>`);
  if (cp.length) voci.push(`<a href="#" onclick="event.preventDefault();go('conti')">
    ⚠ ${cp.length} checkpoint da chiudere</a>`);
  if (scartiCarta.length) voci.push(`<a href="#" onclick="event.preventDefault();go('conti')">
    ⚠ ${scartiCarta.length} mes${scartiCarta.length===1?'e':'i'} di carta da chiudere</a>`);
  if (!voci.length) return `<div class="card" style="padding:8px 13px;margin-bottom:10px;
    border-left:3px solid var(--ok)"><span style="color:var(--ok);font-weight:640">✓ Tutto a posto</span>

    background:var(--amber);display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-weight:600">

}
/* Le tre variazioni piu' forti sul periodo precedente, in linguaggio naturale
   e cliccabili: portano in Analisi gia' filtrate per categoria (§STRUTTURA). */
function variazioniForti(){
  const sp = spese(sel());
  const [pd,pa] = periodoPrec();
  const prec = spese(sel({range:[pd,pa]}));
  const curr = Object.fromEntries(perMacro(sp).map(([k,v]) => [k,v]));
  const prevM = Object.fromEntries(perMacro(prec).map(([k,v]) => [k,v]));
  const chiavi = new Set([...Object.keys(curr), ...Object.keys(prevM)]);
  const righe = [...chiavi].map(k => {
    const c = curr[k]||0, p = prevM[k]||0;
    return {k, c, p, d: c - p};
  }).filter(r => Math.abs(r.d) > 0.5).sort((a,b) => Math.abs(b.d)-Math.abs(a.d)).slice(0,3);
  if (!righe.length) return card('Variazioni più forti sul periodo precedente',
    '<div class="empty">Nessuna variazione significativa rispetto al periodo precedente.</div>');
  return card('Variazioni più forti sul periodo precedente', righe.map(r => {
    const su = r.d > 0;
    return `<div class="legrow" onclick="apriMacro('${esc(r.k)}')">
      ${bolla(r.k, 26)}
      <span class="nm" style="flex:1 1 auto">${esc(r.k)}
        <b class="${su?'neg':'pos'}">${su?'in aumento':'in calo'} di ${eur(Math.abs(r.d))}</b>
        <span class="mut">rispetto al periodo precedente${r.p>0.5?` (da ${eur(r.p)} a ${eur(r.c)})`:' (voce nuova)'}</span></span>
    </div>`;
  }).join(''));
}

    ${metric('Spesa media', eur(usc/giorni), 'al giorno · '+giorni+' gg', '', 'var(--ink3)')}

function metric(lab,val,sub,cls,col){
  return `<div class="metric" style="--mc:${col||'var(--line)'}"><div class="lab">${lab}</div>
    <div class="val ${cls||''}">${val}</div><div class="sub">${sub}</div></div>`;

function polare(cx,cy,r,gradi){
  const a = (gradi-90) * Math.PI/180;
  return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
}
function arco(cx,cy,r,da,a){
  const [x1,y1] = polare(cx,cy,r,da), [x2,y2] = polare(cx,cy,r,a);
  const grande = (a-da) > 180 ? 1 : 0;
  return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${grande} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}
/* Distanzia le bolle che si accavallano, mantenendole in ordine attorno all'anello. */
function distanziaAngoli(angoli, minSep){
  const a = angoli.slice();
  for (let iter = 0; iter < 60; iter++){
    let mosso = false;
    for (let i = 0; i < a.length - 1; i++){
      const d = a[i+1] - a[i];
      if (d < minSep){
        const spinta = (minSep - d) / 2;
        a[i] -= spinta; a[i+1] += spinta; mosso = true;
      }
    }
    if (a.length > 1){                       // chiusura del cerchio
      const d = 360 - a[a.length-1] + a[0];
      if (d < minSep){
        const spinta = (minSep - d) / 2;
        a[a.length-1] -= spinta; a[0] += spinta; mosso = true;
      }
    }
    if (!mosso) break;
  }
  return a;
}
function donut(fette){
  const tot = fette.reduce((s,f)=>s+f.v,0) || 1;
  // Diametro +35% rispetto alla versione precedente (R 162 -> 219), tratto e
  // icone in proporzione: il margine fra bordo e anello resta 15px.
  const CX=258, CY=258, R=219, SW=48, VIS=5, ICO=30;
  // La testa arrotondata sporge di mezza larghezza tratto oltre l'angolo di fine:
  // va sottratta, altrimenti gli archi si toccano nonostante il distacco (§5).
  const cap = Math.asin(Math.min((SW/2)/R, 1)) * 180/Math.PI;
  // L'icona sta DENTRO l'anello, non in una bolla esterna: le bolle attorno al
  // cerchio si ammassavano staccate dal proprio arco ed erano il difetto peggiore.
  // Serve che la fetta sia larga almeno quanto l'icona: ICO/R radianti, con margine.
  const SOGLIA_ICONA = (ICO/R) * 180/Math.PI * 1.35;

  let ang = 0;
  const archi = [], mids = [];
  fette.forEach(f => {
    const sweep = f.v/tot*360, mid = ang + sweep/2;
    // Tutta la fetta è cliccabile, non solo l'icona: è il gesto naturale.
    const clic = f.k === 'Altre categorie' ? ''
      : ` onclick="apriMacro('${esc(f.k)}')" style="cursor:pointer"`;
    const tip = `<title>${esc(f.k)}: ${eur(f.v)} (${pct(f.v,tot).toFixed(1)}%) — clicca per analizzarla</title>`;
    if (fette.length === 1){
      // anello pieno come due semiarchi: niente <circle>, per lo stesso motivo
      // spiegato sotto sulle pastiglie
      archi.push(`<g${clic}><path d="${arco(CX,CY,R,0,180)}" fill="none" stroke="${f.c}" stroke-width="${SW}">${tip}</path>
        <path d="${arco(CX,CY,R,180,360)}" fill="none" stroke="${f.c}" stroke-width="${SW}"/></g>`);
    } else {
      const g = Math.min(VIS, Math.max(sweep*0.18, 1.5));   // fette sottili: distacco ridotto
      const da = ang + cap + g/2, a2 = ang + sweep - cap - g/2;
      if (a2 > da + 0.3){
        archi.push(`<path d="${arco(CX,CY,R,da,a2)}" fill="none" stroke="${f.c}" stroke-width="${SW}"
          stroke-linecap="round"${clic}>${tip}</path>`);
      } else {
        // Troppo sottile per un arco: pastiglia. La disegno come arco degenere e
        // non come <circle>, così tutto il grafico usa un solo tipo di elemento
        // (alcuni renderer scartano i <circle> misti ai <path>, e la verifica
        // visiva perde un pezzo senza accorgersene).
        archi.push(`<path d="${arco(CX,CY,R,mid-0.2,mid+0.2)}" fill="none" stroke="${f.c}"
          stroke-width="${SW}" stroke-linecap="round"${clic}>${tip}</path>`);
      }
    }
    mids.push({ang: mid, sweep, f});
    ang += sweep;
  });

  // Icona bianca al centro dell'anello, sopra il proprio colore.
  const icone = mids.filter(m => m.sweep >= SOGLIA_ICONA).map(m => {
    const [ix,iy] = polare(CX,CY,R,m.ang);
    const altre = m.f.k === 'Altre categorie';
    const p = altre ? ICONA_DEFAULT : iconaPath(m.f.k);
    return `<g ${altre?'':`onclick="apriMacro('${esc(m.f.k)}')" style="cursor:pointer"`}>
      <g transform="translate(${(ix-ICO/2).toFixed(1)},${(iy-ICO/2).toFixed(1)}) scale(${(ICO/24).toFixed(4)})">
        <path d="${p}" fill="#ffffff" opacity=".95"/></g>
      <title>${esc(m.f.k)}: ${eur(m.f.v)}</title></g>`;
  }).join('');

  const s = eur(tot);
  return `<svg viewBox="0 0 516 516" width="516" height="516" style="display:block;max-width:100%;height:auto">
    ${archi.join('')}${icone}
    <text x="${CX}" y="${CY-16}" text-anchor="middle" font-size="16" fill="#78838f"
      letter-spacing=".05em">USCITE TOTALI</text>
    <text x="${CX}" y="${CY+24}" text-anchor="middle" font-size="40" font-weight="700" fill="#12181f"
      font-family="ui-monospace,'Segoe UI',monospace">${esc(s)}</text></svg>`;
}
/* Le spese di dettaglio carta non muovono il conto corrente: incide solo
   l'addebito del saldo (§6). Stessa regola usata dalla pipeline. */
function muoveIlConto(t){
  if (t.sub === 'Riconciliazione carta') return true;
  return !['CARTA DI CREDITO','INTESA - CARTA'].includes(String(t.fonte).toUpperCase());
}
/* Ponte fra i totali della vista e il saldo reale del conto: ogni riga è
   verificabile, e la somma deve dare esattamente il saldo finale. */
function quadraturaConto(){
  const conto = contoSingolo();
  const ap = (S.bal.saldi_apertura||{})[conto];
  if (!ap || ap.importo == null || !ap.data) return card('Quadratura conto',
    `<div class="empty">Imposta il saldo di apertura di <b>${esc(conto)}</b> nella scheda Conti
     per vedere la quadratura.</div>`);

  const [d0,a0] = rangePeriodo();
  const dInizio = d0 > ap.data ? d0 : ap.data;
  const dFine = a0 > S.oggi ? S.oggi : a0;
  if (dFine < ap.data) return card('Quadratura conto',
    `<div class="empty">Il periodo selezionato precede la data di apertura (${dmy(ap.data)}).</div>`);

  const nel = t => t.conto === conto && muoveIlConto(t);
  const prima = S.tx.filter(t => nel(t) && t.data >= ap.data && t.data < dInizio)
                    .reduce((s,t) => s + t.importo, 0);
  const iniziale = ap.importo + prima;
  const per = S.tx.filter(t => nel(t) && t.data >= dInizio && t.data <= dFine);
  const ent = per.filter(t=>t.tipo==='Entrata').reduce((s,t)=>s+imp(t),0);
  const usc = per.filter(t=>t.tipo==='Spesa').reduce((s,t)=>s+imp(t),0);
  const neu = per.filter(t=>t.tipo==='Neutro').reduce((s,t)=>s+imp(t),0);
  const altrui = per.reduce((s,t)=>s + (t.importo - imp(t)), 0);
  const finale = iniziale + per.reduce((s,t)=>s+t.importo,0);
  const altro = S.persona==='GC' ? 'VT' : (S.persona==='VT' ? 'GC' : null);
  const filtriAttivi = S.filtri.sfera||S.filtri.immobile||S.filtri.viaggio||S.filtri.categoria||S.cerca;

  const riga = (lab,val,cls,sub) => `<tr><td>${lab}${sub?`<br><small class="mut">${sub}</small>`:''}</td>
    <td class="num ${cls||''}">${val>=0&&cls==='pos'?'+':''}${eur2(val)}</td></tr>`;

  return card('Quadratura conto', `<table><tbody>
    ${riga(`Saldo al ${dmy(dInizio)}`, iniziale, '', dInizio!==ap.data?`apertura ${dmy(ap.data)} + movimenti precedenti`:'saldo di apertura')}
    ${riga('Entrate del periodo', ent, 'pos')}
    ${riga('Uscite del periodo', usc, 'neg')}
    ${Math.abs(neu)>0.005 ? riga('Movimenti neutri', neu, 'mut', 'giroconti, prelievi, carta') : ''}
    ${altro && Math.abs(altrui)>0.005
      ? riga(`Quota di ${altro}`, altrui, 'mut', 'metà delle spese condivise, esclusa dalla tua vista') : ''}
    <tr style="background:var(--head);font-weight:680"><td>Saldo al ${dmy(dFine)}</td>
      <td class="num">${eur2(finale)}</td></tr>
  </tbody></table>
  <div class="hint" style="margin-top:8px">${filtriAttivi
    ? '⚠ La quadratura ignora i filtri Sfera, Immobile, Viaggio e la ricerca: mostra sempre il conto per intero.'
    : 'Ogni riga è sommabile: il totale coincide con il saldo teorico del conto.'}</div>`, '', false);
}
function graficoMensile(){
  const [d,a] = rangePeriodo();
  const mesi = [...new Set(S.tx.filter(t=>t.data>=d&&t.data<=a).map(t=>t.mese))].sort();
  if (mesi.length < 2) return '<div class="mut" style="padding:8px 0">Serve più di un mese per vedere un andamento.</div>';
  const dati = mesi.map(m => { const l = sel({range:[m+'-01', m+'-31']});
    return {m, u: Math.abs(somma(spese(l))), e: somma(entrate(l))}; });
  const max = Math.max(...dati.map(x => Math.max(x.u, x.e)), 1);
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  const tick = Math.ceil(max/step/4)*step;
  const ticks = []; for (let v=0; v<=max*1.02; v+=tick) ticks.push(v);

  const W=1000, H=190, PL=58, PR=8, PT=8, PB=22;
  const iw = W-PL-PR, ih = H-PT-PB;
  const bw = iw/dati.length;
  const y = v => PT + ih - (v/(ticks[ticks.length-1]||max))*ih;

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="200" style="display:block">
    ${ticks.map(v=>`<g><line x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}" stroke="#eaeef3" stroke-width="1"/>
      <text x="${PL-7}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="#9aa4af" font-family="ui-monospace,monospace">${v>=1000?(v/1000)+'k':v}</text></g>`).join('')}
    ${dati.map((x,i)=>{
      const cx = PL + bw*i, bwi = Math.min(bw*0.34, 34), gap = bw*0.06;
      return `<g>
        <rect x="${cx+bw/2-bwi-gap/2}" y="${y(x.e)}" width="${bwi}" height="${Math.max(PT+ih-y(x.e),0)}" fill="#158A4C" rx="2">
          <title>${labelMese(x.m)} — entrate ${eur(x.e)}</title></rect>
        <rect x="${cx+bw/2+gap/2}" y="${y(x.u)}" width="${bwi}" height="${Math.max(PT+ih-y(x.u),0)}" fill="#C22D25" rx="2">
          <title>${labelMese(x.m)} — uscite ${eur(x.u)}</title></rect>
        <text x="${cx+bw/2}" y="${H-7}" text-anchor="middle" font-size="10.5" fill="#78838f">${labelMese(x.m)}</text>
      </g>`;}).join('')}
    <line x1="${PL}" x2="${W-PR}" y1="${PT+ih}" y2="${PT+ih}" stroke="#d8dee6"/>
  </svg>
  <div style="display:flex;gap:14px;margin-top:2px;padding-left:58px">
    <span class="leg" style="cursor:default"><span class="sw" style="background:#158A4C"></span>Entrate</span>
    <span class="leg" style="cursor:default"><span class="sw" style="background:#C22D25"></span>Uscite</span></div>`;
}

/* Click da Panoramica (fette/icone della ciambella, righe della legenda,
   variazioni piu' forti): apre il pannello categoria (Lavoro 3) invece di
   saltare dritto in Analisi — un passo intermedio per sbirciare senza perdere
   il contesto. Da li' "Vedi tutto in Analisi" fa quello che apriMacro faceva
   prima da sola. */
function apriMacro(k){ S.pannello = {modo:'categoria', macro:k}; renderPannello(); }
function apriVoceEntrata(k){ S.pannello = {modo:'categoria', voce:k, entrata:true}; renderPannello(); }

/* ============================================================ DRILL-DOWN
   Codice storico della Panoramica (§STRUTTURA compito 3): non piu' invocato
   da nessuna vista da quando Analisi (compito 2) offre la stessa capacita' in
   forma tabellare con raggruppamenti, ordinamento ed esportazione. Lasciato
   presente per esplicita istruzione ("non va cancellato"), non per essere
   richiamato: se un domani serve rimuoverlo davvero, questo e' il blocco. */

/* serie degli ultimi N mesi per ciascun gruppo, ancorata alla fine del periodo */
function serieMensili(fnChiave, nMesi){
  nMesi = nMesi || 6;
  const r = rangePeriodo();
  const fine = (r[1] > S.oggi ? S.oggi : r[1]).slice(0,7);
  const mesi = []; for (let i = nMesi-1; i >= 0; i--) mesi.push(shiftMese(fine, i));
  const idx = Object.fromEntries(mesi.map((m,i) => [m,i]));
  const map = {};
  S.tx.forEach(t => {
    if (t.tipo !== 'Spesa') return;
    if (!(t.mese in idx)) return;
    if (!passaFiltri(t)) return;
    if (quota(t) <= 0) return;
    const k = fnChiave(t);
    (map[k] = map[k] || new Array(nMesi).fill(0))[idx[t.mese]] += Math.abs(imp(t));
  });
  return {mesi, map};
}
function spark(vals, mesi, col){
  if (!vals || !vals.some(v => v > 0.005))
    return `<span class="mut" style="font-size:10.5px">nessun dato</span>`;
  const max = Math.max(...vals);
  const W = 110, H = 21, bw = W/vals.length;
  return `<span class="sparkwrap"><svg width="${W}" height="${H}" style="overflow:visible">
    ${vals.map((v,i) => {
      const h = Math.max(v/max*H, v > 0.005 ? 1.5 : 0);
      return `<rect x="${(i*bw+1).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw-2).toFixed(1)}"
        height="${h.toFixed(1)}" fill="${col}" opacity="${i===vals.length-1?'1':'.38'}" rx="1"
        ><title>${labelMese(mesi[i])}: ${eur(v)}</title></rect>`;
    }).join('')}
  </svg></span>`;
}

function drillDown(sp){
  if (!sp.length) return '<div class="empty">Nessuna spesa nel periodo selezionato.</div>';
  const tot = sp.reduce((s,t)=>s+Math.abs(imp(t)),0);
  const [pd,pa] = periodoPrec();
  const prec = spese(sel({range:[pd,pa]}));

  const chiave = S.raggr === 'esercente'
    ? (t => (t.merchant || t.descrizione.slice(0,34) || '—').toUpperCase())
    : (t => t.macro);
  const gruppi = aggrega(sp, chiave);
  const gruppiPrec = aggrega(prec, chiave);
  const maxV = gruppi[0]?.v || 1;
  const s1 = serieMensili(chiave);
  const s2 = S.raggr === 'categoria' ? serieMensili(t => t.macro+'||'+t.sub) : {mesi:s1.mesi, map:{}};
  const ctx = {serie1:s1.map, serie2:s2.map, mesi:s1.mesi};

  return `<div class="tree">
    <div class="tnode" style="cursor:default;background:var(--head);font-size:10.5px;text-transform:uppercase;
      letter-spacing:.05em;color:var(--ink3);font-weight:680;border-bottom:1px solid var(--line)">
      <span></span><span>${S.raggr==='esercente'?'Esercente':'Categoria'}</span><span>Peso</span>
      <span>${labelMese(ctx.mesi[0])} → ${labelMese(ctx.mesi[ctx.mesi.length-1])}</span>
      <span style="text-align:right">Totale</span><span style="text-align:right">%</span>
      <span style="text-align:right">Mov.</span><span style="text-align:right">Δ prec.</span></div>
    ${gruppi.map(g => nodoLivello1(g, tot, maxV, gruppiPrec, ctx)).join('')}
    <div class="tnode" style="cursor:default;font-weight:680;background:var(--head)">
      <span></span><span>TOTALE</span><span></span><span></span>
      <span class="num" style="text-align:right">${eur(tot)}</span><span class="num" style="text-align:right">100%</span>
      <span class="num" style="text-align:right">${sp.length}</span><span></span></div>
  </div>`;
}
function nodoLivello1(g, tot, maxV, prec, ctx){
  const id = 'm|' + g.k, aperto = S.open.has(id);
  const old = prec.find(p => p.k === g.k)?.v || 0;
  const d = g.v - old;
  const col = S.raggr === 'categoria' ? colore(g.k) : 'var(--accent)';
  let h = `<div class="tnode ${aperto?'open':''}" id="nd_m_${idSafe(g.k)}" onclick="toggleNodo('${esc(id)}')">
    <span class="car">▶</span>
    <span class="nm">${S.raggr==='categoria'
      ? bolla(g.k, 20)
      : `<span class="ico" style="background:var(--accent);width:20px;height:20px">
          <svg viewBox="0 0 24 24" style="width:12px;height:12px"><path d="${ICONE['E-COMMERCE']}"/></svg></span>`}${esc(g.k)}</span>
    <span class="track"><i style="width:${pct(g.v,maxV)}%;background:${col}"></i></span>
    <span>${spark(ctx.serie1[g.k], ctx.mesi, col)}</span>
    <span class="num" style="text-align:right;font-weight:650">${eur(g.v)}</span>
    <span class="num mut" style="text-align:right">${pct(g.v,tot).toFixed(0)}%</span>
    <span class="num mut" style="text-align:right">${g.n}</span>
    <span class="num ${d>0?'neg':'pos'}" style="text-align:right">${old?((d>0?'+':'')+eur(d)):'<span class="mut">—</span>'}</span>
  </div>`;
  if (!aperto) return h;

  if (S.raggr === 'esercente') return h + foglie(g.tx, id);
  const subs = aggrega(g.tx, t => t.sub || '—');
  const maxSub = subs[0]?.v || 1;
  h += subs.map(s => {
    const sid = 's|' + g.k + '|' + s.k, sAperto = S.open.has(sid);
    return `<div class="tnode l2 ${sAperto?'open':''}" onclick="event.stopPropagation();toggleNodo('${esc(sid)}')">
      <span class="car">▶</span><span class="nm">${esc(s.k)}</span>
      <span class="track"><i style="width:${pct(s.v,maxSub)}%;background:${col};opacity:.55"></i></span>
      <span>${spark(ctx.serie2[g.k+'||'+s.k], ctx.mesi, col)}</span>
      <span class="num" style="text-align:right">${eur(s.v)}</span>
      <span class="num mut" style="text-align:right">${pct(s.v,g.v).toFixed(0)}%</span>
      <span class="num mut" style="text-align:right">${s.n}</span><span></span></div>`
      + (sAperto ? foglie(s.tx, sid) : '');
  }).join('');
  return h;
}
function foglie(tx, id){
  const ordinati = [...tx].sort((a,b) => Math.abs(imp(b)) - Math.abs(imp(a)));
  const limite = S.open.has('all|'+id) ? ordinati.length : 12;
  let h = ordinati.slice(0, limite).map(t => `<div class="tleaf"
    onclick="event.stopPropagation();apriModifica('${esc(t.key)}')" title="Clicca per correggere la categoria">
    <span></span><span class="n mut">${dmy(t.data)}</span>

    <span class="cat">${esc(t.sub)}${t.stato==='Manuale'?' <span class="tag coppia">man</span>':''}</span>
    <span class="mut" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.conto)}</span>
    <span class="num" style="text-align:right;font-weight:600">${eur2(imp(t))}
      <span class="edit">✎</span></span></div>`).join('');
  if (ordinati.length > limite) h += `<div class="tmore">
    <a href="#" onclick="event.stopPropagation();toggleNodo('all|${esc(id)}');return false">
      Mostra tutti i ${ordinati.length} movimenti →</a></div>`;
  return h;
}

async function salvaModifica(key){
  const t = S.tx.find(x => x.key === key);
  const ma = document.getElementById('edMacro').value;
  const su = document.getElementById('edSub').value;
  const persona = document.getElementById('edPers').value;
  const stato = document.getElementById('edStato').value;
  const regola = document.getElementById('edRegola')?.checked;
  if (!ma || !su) return toast('Scegli categoria e voce');
  chiudiModale();
  const body = {movimenti: {[key]: {macro:ma, sub:su, persona, stato}}};

    {[chiaveMerchant(t.merchant)]: {macro:ma, sub:su, segno: t.importo >= 0 ? 'positivo' : 'negativo'}};
  await post('/api/overrides', body);
  toast(regola ? 'Movimento corretto e regola memorizzata' : 'Movimento corretto');
}

          <option value="">— nessuno —</option>

}
/* ---------- selettori categoria: macro + voce dipendente ---------- */
function macroSelezionabili(){
  return Object.entries(S.tax.macro||{}).filter(([m]) => m !== 'DA VERIFICARE');
}
function sottoVoci(macro){ return (S.tax.macro?.[macro]?.sub) || []; }

function optMacro(sel){
  return `<option value="">— categoria —</option>` + macroSelezionabili()
    .map(([m]) => `<option value="${esc(m)}" ${sel===m?'selected':''}>${esc(m)}</option>`).join('');
}
function optSub(macro, sel){
  const subs = sottoVoci(macro);
  if (!macro) return `<option value="">— voce —</option>`;
  if (subs.length === 1) return `<option value="${esc(subs[0])}" selected>${esc(subs[0])}</option>`;
  return `<option value="">— voce —</option>` + subs
    .map(s => `<option value="${esc(s)}" ${sel===s?'selected':''}>${esc(s)}</option>`).join('');
}
/* stato corrente della riga: pending se toccata, altrimenti il valore del movimento */
function valMacro(t){ const p = S.pending[t.key]; return p && 'macro' in p ? p.macro : t.macro; }
function valSub(t){ const p = S.pending[t.key]; return p && 'sub' in p ? p.sub : t.sub; }
function completa(key){ const p = S.pending[key]; return !!(p && p.macro && p.sub); }
/* Una riga con una proposta del sistema gia' impostata nel menu (non ancora
   toccata dall'utente) DEVE contare come pronta: altrimenti il bottone dice
   "Conferma 1" pur mostrando 10 categorie selezionate, e la maggior parte
   resta in coda senza che sia chiaro perche' (trappola scoperta dall'utente). */
/* Scelta esplicita dell'utente su questa riga, distinta dalla proposta
   automatica del sistema. Con i movimenti mostrati tutti insieme la
   differenza conta: "Conferma" deve salvare solo quello che ho deciso io,
   altrimenti un click solo confermerebbe centinaia di righe mai guardate
   (§5, "regola che tocca decine di movimenti senza avviso"). Le proposte
   si accettano con il bottone dedicato, che le rende scelte a tutti gli
   effetti e lascia il tempo di correggerle. */
function sceltoDaUtente(t){
  const p = S.pending[t.key];
  return !!(p && p.macro && p.sub);
}
/* Il nome di una macro puo' contenere " / ": "ABBONAMENTI / SOFTWARE / GAMING".
   Spezzando il candidato e prendendo i primi due pezzi si ottiene una coppia
   che non esiste in tassonomia (macro "ABBONAMENTI", voce "SOFTWARE"), e la
   regola imparata da li' nasce gia' rotta. L'ULTIMO pezzo e' la voce, tutto
   quello che sta prima e' la macro. */
function spezzaCandidato(c){
  const p = String(c || '').split(' / ');
  if (p.length < 2) return [p[0] || '', ''];
  const sub = p.pop();
  return [p.join(' / '), sub];
}
function prontoPerConferma(t){
  const p = S.pending[t.key];
  if (p && p.macro && p.sub) return true;
  if (p && ('macro' in p || 'sub' in p)) return false;   // modifica iniziata, non conclusa
  const sugg = (t.candidati && t.candidati.length) ? spezzaCandidato(t.candidati[0]) : null;
  return !!(sugg && sugg[0] && sugg[1]);
}
function risolviCategoria(t){
  const p = S.pending[t.key];
  if (p && p.macro && p.sub) return [p.macro, p.sub];
  return spezzaCandidato(t.candidati[0] || '');
}

function edit(key,campo,val){
  const p = S.pending[key] = S.pending[key] || {};
  if (val === '') delete p[campo]; else p[campo] = val;
  if (campo === 'macro'){
    const subs = sottoVoci(val);
    if (subs.length === 1) p.sub = subs[0];          // voce unica: la scelgo io
    else if (!subs.includes(p.sub)) delete p.sub;    // voce non compatibile: da riscegliere
    if (val !== 'CASA' && val !== 'ENTRATE') delete p.immobile;  // non piu' pertinente
    if (val !== 'VIAGGI') delete p.viaggio;
  }
  // la voce e' stata cambiata senza aver mai toccato la categoria: quella
  // mostrata (la proposta del sistema) va resa esplicita, altrimenti la riga
  // sembra completa ma "prontoPerConferma" la considera una modifica a meta'
  // e la blocca (trappola scoperta dall'utente su un rimborso PayPal)
  if (campo === 'sub' && !('macro' in p)){
    const t = S.tx.find(x => x.key === key);
    const sugg = t?.candidati?.length ? spezzaCandidato(t.candidati[0]) : null;
    if (sugg && sugg[0]) p.macro = sugg[0];
  }
  if (!Object.keys(p).length) delete S.pending[key];
  render();
}
/* come edit(), ma il valore vuoto resta un valore esplicito (null) invece di
   annullare la modifica: serve per poter rimuovere un immobile/viaggio/sfera
   gia' impostato, non solo per impostarne uno nuovo (trappola §5) */
function editValore(key,campo,val){
  const p = S.pending[key] = S.pending[key] || {};
  p[campo] = val || null;
  render();
}
/* usato dentro le modali, dove non si ri-renderizza tutta la pagina */
function popolaSub(macro, idSub){
  const el = document.getElementById(idSub);
  if (el) el.innerHTML = optSub(macro, '');
}
function bottoneSalva(){
  const n = Object.keys(S.pending).length;
  return `<button class="btn pri" ${n?'':'disabled'} onclick="salvaPending()">Salva ${n||''} ${n===1?'correzione':'correzioni'}</button>`;
}
/* Scrive la coppia categoria/voce dentro l'override, ricavando la parte che
   l'utente NON ha toccato.

   Prima qui c'era `if (p.macro && p.sub)`, che su un movimento gia'
   classificato buttava via la modifica: cambiando la sola Voce, p.macro
   restava vuoto, la condizione era falsa e non veniva scritto niente - mentre
   il messaggio diceva "salvato". Succedeva anche il contrario, cambiando la
   sola Categoria. Caso reale: il bonifico TRAUNIK ADA del 10/02/2026, dove
   l'Immobile si salvava e la Voce no.

   Ritorna null se la coppia e' valida e scritta, altrimenti il motivo: chi
   chiama DEVE dirlo all'utente invece di annunciare un salvataggio riuscito. */
function applicaCategoria(o, p, key){
  if (!('macro' in p) && !('sub' in p)) return null;
  const t = S.tx.find(x => x.key === key);
  const macro = p.macro || (('macro' in p) ? null : (o.macro || t?.macro));
  if (!macro) return 'manca la categoria';
  const voci = sottoVoci(macro);
  let sub = p.sub;
  if (!sub){
    // categoria cambiata senza scegliere la voce: tengo quella attuale se
    // appartiene alla nuova categoria, oppure quella unica se ce n'e' una sola
    const attuale = o.sub || t?.sub;
    if (attuale && voci.includes(attuale)) sub = attuale;
    else if (voci.length === 1) sub = voci[0];
  }
  if (!sub) return `scegli anche la voce per ${macro}`;
  if (voci.length && !voci.includes(sub)) return `"${sub}" non appartiene a ${macro}`;
  o.macro = macro; o.sub = sub;
  return null;
}
async function salvaPending(){
  const mov = {}; const problemi = [];
  for (const [k,p] of Object.entries(S.pending)){
    // parte dall'override gia' salvato per questa chiave (se c'e'): altrimenti
    // modificare un solo campo (es. Viaggio) sovrascriverebbe l'intera riga sul
    // server e cancellerebbe macro/sub/persona gia' confermati in precedenza
    const o = {...(S.ov.movimenti?.[k] || {})};
    o.stato = p.stato || o.stato || 'Manuale';
    const err = applicaCategoria(o, p, k);
    if (err){ problemi.push(err); continue; }   // non salvo a meta' e non mento
    if (p.persona) o.persona = p.persona;
    if ('immobile' in p) o.immobile = p.immobile;
    if ('viaggio' in p) o.viaggio = p.viaggio;
    if ('sfera' in p) o.sfera = p.sfera;
    mov[k] = o;
    delete S.pending[k];
  }
  const n = Object.keys(mov).length;
  if (n) await post('/api/overrides', {movimenti: mov});
  toast(`${n} ${n===1?'correzione salvata':'correzioni salvate'}` +
    (problemi.length ? ` · ${problemi.length} non salvat${problemi.length===1?'a':'e'}: ${problemi[0]}` : ' e riapplicate'));
  if (problemi.length) render();
}

function toggleGruppoAnalisi(id){ S.openAnalisi.has(id) ? S.openAnalisi.delete(id) : S.openAnalisi.add(id); render(); }
/* Aggrega SENZA soglia di scarto (a differenza di aggrega()/perMacro): ogni
   movimento deve restare rintracciabile in un gruppo, mai sparire (§STRUTTURA
   compito 2). Somma con segno: entrate positive, spese negative, come imp(). */
function aggregaAnalisi(lista, fnChiave){
  const m = {};
  lista.forEach(t => { const k = fnChiave(t);
    (m[k] = m[k] || {k, tot:0, proprie:0, comuni:0, n:0, tx:[]});
    const p = pesi(t);
    m[k].tot += imp(t);
    m[k].proprie += t.importo * p.proprie;
    m[k].comuni  += t.importo * p.comuni;
    m[k].n++; m[k].tx.push(t);
  });
  return Object.values(m);
}
/* Come serieMensili(), ma su tutti i tipi di movimento (Analisi puo' raggruppare
   anche per ENTRATE, conto, ecc.), non solo sulle spese. */
function serieMensiliAnalisi(fnChiave, nMesi){
  nMesi = nMesi || 6;
  const r = rangePeriodo();
  const fine = (r[1] > S.oggi ? S.oggi : r[1]).slice(0,7);
  const mesi = []; for (let i = nMesi-1; i >= 0; i--) mesi.push(shiftMese(fine, i));
  const idx = Object.fromEntries(mesi.map((m,i) => [m,i]));
  const map = {};
  S.tx.forEach(t => {
    if (!(t.mese in idx)) return;
    if (!passaFiltri(t)) return;
    if (quota(t) <= 0) return;
    const k = fnChiave(t);
    (map[k] = map[k] || new Array(nMesi).fill(0))[idx[t.mese]] += Math.abs(imp(t));
  });
  return {mesi, map};
}

function saldoLiquido(){
  const ap = S.bal.saldi_apertura || {};
  let conti = (S.report.conti||[]).filter(c => ap[c.conto]?.importo != null);
  if (S.conti.length) conti = conti.filter(c => S.conti.includes(c.conto));  // segue i conti scelti
  else if (S.persona === 'GC' || S.persona === 'VT') conti = conti.filter(c => {  // solo conti propri o condivisi
    const int = intestatario(c.conto);
    return int === S.persona || int === 'Coppia';
  });
  else if (S.persona === 'Comuni') conti = conti.filter(c => intestatario(c.conto) === 'Coppia');
  if (!conti.length) return null;
  return conti.reduce((s,c) => s + (c.saldo_teorico ?? 0), 0);
}
function intestatario(conto){ return S.tx.find(x => x.conto === conto)?.intestatario_conto || ''; }
/* Separazione richiesta da STRUTTURA.md (compito 5): non c'e' un flag in
   category_map.json per questo (modificarlo richiederebbe conferma §1), quindi
   l'elenco resta qui, lato dashboard, dove non tocca la governance dei config. */
const CONTI_CORRENTI = ['Unicredit GC','Intesa cointestato','Fineco VT','Intesa personale VT'];
/* "Intesa carta 4160" non compare mai in S.report.conti: le sue spese non
   "muovono il conto" (§6, muove_il_conto() lato Python le esclude apposta
   dall'aggregato di saldo), quindi la pipeline non le somma mai per quel
   nome di conto. Per questa tabella va letta direttamente da S.tx. */
const STRUMENTI_SENZA_SALDO = ['Intesa carta 4160','PayPal','Contanti','Edenred GC','Edenred VT'];
function movimentiPeriodoConto(conto){
  const [d,a] = rangePeriodo();
  return S.tx.filter(t => t.conto === conto && t.data >= d && t.data <= a);
}
/* ------------------------------------------------------------ ESTRATTO CONTO
   Non è una terza copia di Transazioni: quella lista risponde a "dove sono
   finiti i soldi" ed è ordinata e filtrata per categoria. Questa risponde a
   "il conto quadra?", e per farlo serve un'altra forma: ordine cronologico,
   saldo progressivo riga per riga, e soprattutto l'IMPORTO REALE del movimento
   invece della quota della persona selezionata. Confondere le due colonne è la
   trappola del §5 — due dati sbagliati dello stesso fattore quadrano fra loro
   e nessun controllo interno se ne accorge. Qui la colonna che conta è quella
   che si confronta con l'app della banca. */
function estrattoConto(){
  const conto = contoSingolo();
  if (!conto) return '';
  const ap = (S.bal.saldi_apertura||{})[conto];
  const senzaSaldo = STRUMENTI_SENZA_SALDO.includes(conto);
  const [d0,a0] = rangePeriodo();
  const dFine = a0 > S.oggi ? S.oggi : a0;
  const dInizio = (ap && ap.data && ap.data > d0) ? ap.data : d0;

  // Le spese di dettaglio carta non muovono il conto (§6): tenerle dentro il
  // saldo progressivo lo farebbe divergere dall'estratto vero. Restano
  // mostrabili col pulsante, ma non entrano mai nel progressivo.
  const tutte = S.tx.filter(t => t.conto === conto && t.data >= dInizio && t.data <= dFine)
                    .sort((a,b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
  const muovono = tutte.filter(muoveIlConto);
  const nonMuovono = tutte.length - muovono.length;
  const righe = S.estrattoTutto ? tutte : muovono;

  // saldo di partenza: apertura più tutto quello che è passato prima dell'inizio
  let saldo = null;
  if (ap && ap.importo != null && ap.data && dFine >= ap.data){
    const prima = S.tx.filter(t => t.conto === conto && muoveIlConto(t)
                    && t.data >= ap.data && t.data < dInizio)
                    .reduce((s,t) => s + t.importo, 0);
    saldo = ap.importo + prima;
  }
  const scomponi = S.persona === 'GC' || S.persona === 'VT';
  const totReale = muovono.reduce((s,t) => s + t.importo, 0);

  const azioni = `${nonMuovono ? `<button class="btn sm ${S.estrattoTutto?'pri':''}"
      onclick="S.estrattoTutto=!S.estrattoTutto;render()">
      ${S.estrattoTutto?'Nascondi':'Mostra'} le ${nonMuovono} spese di carta</button>` : ''}`;

  return card(`Estratto conto · ${esc(conto)}`, `
    <div class="hint" style="margin-bottom:8px">
